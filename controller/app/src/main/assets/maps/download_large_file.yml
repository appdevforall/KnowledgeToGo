# K2GO-394 (Deliverable B) -- app-side runtime overlay of the upstream maps download task.
#
# The app copies this file over roles/maps/tasks/download_large_file.yml in the rootfs
# BEFORE running the maps runrole. It is byte-identical to the upstream task EXCEPT the
# single "Download ..." task is split into two by is_proot, so the app (a proot host) can
# drive the in-proot aria2c over JSON-RPC:
#   - when: not is_proot -> the upstream aria2c, untouched.
#   - when: is_proot     -> the same aria2c with --continue (resume the partial) and
#                           --enable-rpc --rpc-listen-all=false (loopback control), plus the
#                           per-run secret/port the app writes into local_vars.
# Two separate tasks (not conditional flags on one) so upstream can evolve their non-proot
# block without touching ours. Both keep `creates: dest_path` and the identical post-download
# tail (duplicated on purpose, for block isolation). This overlay is TEMPORARY, pending the
# upstream PR to iiab/iiab (see controller/docs/K2GO-394-maps-download-rpc-patch.md).
#
# Below the split, everything is verbatim from the upstream task.

- name: "Make sure archives end in .tar.gz as expected"
  assert:
    that: (not (expand_archive | default(false))) or item[-7:] == ".tar.gz"
    fail_msg: "Error: expect download file name to end in .tar.gz when expand_archive=true"
    quiet: yes

- vars:
    file_name: "{{ item | split('/') | last }}"

    # Where the file eventually goes. [:-7] is for .tar.gz
    dest_path: "{{ dest_base_path }}/{{ file_name[:-7] if expand_archive | default(false) else file_name }}"

    # Use md5sum to generate the log file name:
    # * Name has short, consistent length. The "to check progress..." message
    #   fits within 80 characters on terminal (at least in the current
    #   ansible version) in case users have small screens.
    # * If the user mis-copies, it's less likely to do anything destructive.
    log_file: "{{ item | hash('md5') }}.log"
    working_dir: "/library/downloads/maps"

    # If `file_name` is an archive, it needs to be extracted to `extracted_dir_name`
    # before moving to the final destination.
    extracted_dir_name: "{{ file_name[:-7] if expand_archive | default(false) else '' }}"

  block:
    - name: "Fetching file size for {{ item }} via .meta4 file"
      shell: |
        import sys, xmltodict, requests, os

        if os.path.exists("{{ dest_path }}"):
          sys.exit(0)

        size = int(xmltodict.parse(
          requests.get("{{ item }}.meta4").content
        )['metalink']['file']['size'])
        KiB = 1024
        MiB = KiB * 1024
        GiB = MiB * 1024

        if size < MiB:
          size_disp = str(round(size / KiB, 2)) + ' KiB'
        elif size < GiB:
          size_disp = str(round(size / MiB, 2)) + ' MiB'
        else:
          size_disp = str(round(size / GiB, 2)) + ' GiB'
        print('(' + size_disp + ') To check download progress, see previous step (above).')
      args:
        executable: /usr/bin/python3

      # The existence of console output in download_file_details
      # implies that the download should happen.
      register: download_file_details

    # Bright green Ansible output, so blank lines are probably not necessary in the end?
    - debug:
        msg:
          - "   TO CHECK DOWNLOAD PROGRESS, RUN:   "
          - "   tail {{ working_dir }}/{{ log_file }}   "
      # If the file already exists (and thus no download will happen) the above
      # task should exit before any console output.
      when: download_file_details.stdout_lines|length != 0

    # K2GO-394: non-proot -- the upstream aria2c, untouched.
    - name: "Download {{ file_name }} {{ download_file_details.stdout_lines.0 | default('(done)')}}"
      # cd to the temp directory so that the aria2c file, data file, and (perhaps
      # eventually) torrent file all end up there.
      shell: |
        set -euo pipefail

        cd {{ working_dir }}

        date > "{{ log_file }}"
        echo "Downloading {{ file_name }}..." >> "{{ log_file }}"
        echo >> "{{ log_file }}"
        aria2c \
            --async-dns=false \
            --connect-timeout="{{ download_timeout }}" \
            --log-level=warn \
            --console-log-level=warn \
            --summary-interval=60 \
            --download-result=hide \
            --follow-metalink=mem \
            --max-connection-per-server=4 \
            --file-allocation=falloc \
            --show-console-readout=false \
            --enable-http-pipelining=true \
            --seed-time=0 \
            --allow-overwrite=true \
            "{{ item }}.meta4" \
            >> "{{ log_file }}"

        chmod 644 "{{ file_name }}"
        if "{{ 'true' if expand_archive | default(false) else 'false' }}"; then
            rm -rf "{{ extracted_dir_name }}"
            mkdir "{{ extracted_dir_name }}"
            chmod 755 "{{ extracted_dir_name }}"
            tar xzf "{{ file_name }}" -C "{{ extracted_dir_name }}" --strip-components 1
            rm "{{ file_name }}"
            mv "{{ extracted_dir_name }}" "{{ dest_path }}"
        else
            mv "{{ file_name }}" "{{ dest_path }}"
        fi
        rm "{{ log_file }}"
      args:
        executable: /bin/bash
        creates: "{{ dest_path }}"
      when: not is_proot

    # K2GO-394: proot -- the same aria2c, but resumable (--continue, no --allow-overwrite) and
    # host-controllable over loopback JSON-RPC (--enable-rpc). The app pauses/resumes/monitors it
    # by the per-run secret + port written into local_vars (maps_download_rpc_secret/port). The
    # RPC listener is loopback-only (--rpc-listen-all=false). aria2c stays alive while its one
    # download is paused, so this Ansible task keeps blocking and the play does not advance.
    - name: "Download {{ file_name }} {{ download_file_details.stdout_lines.0 | default('(done)')}}"
      shell: |
        set -euo pipefail

        cd {{ working_dir }}

        date > "{{ log_file }}"
        echo "Downloading {{ file_name }}..." >> "{{ log_file }}"
        echo >> "{{ log_file }}"
        aria2c \
            --async-dns=false \
            --connect-timeout="{{ download_timeout }}" \
            --log-level=warn \
            --console-log-level=warn \
            --summary-interval=60 \
            --download-result=hide \
            --follow-metalink=mem \
            --max-connection-per-server=4 \
            --file-allocation=falloc \
            --show-console-readout=false \
            --enable-http-pipelining=true \
            --seed-time=0 \
            --continue=true \
            --enable-rpc=true \
            --rpc-listen-all=false \
            --rpc-listen-port="{{ maps_download_rpc_port | default(6810) }}" \
            {{ ('--rpc-secret=' + maps_download_rpc_secret) if (maps_download_rpc_secret | default('')) | length > 0 else '' }} \
            "{{ item }}.meta4" \
            >> "{{ log_file }}"

        chmod 644 "{{ file_name }}"
        if "{{ 'true' if expand_archive | default(false) else 'false' }}"; then
            rm -rf "{{ extracted_dir_name }}"
            mkdir "{{ extracted_dir_name }}"
            chmod 755 "{{ extracted_dir_name }}"
            tar xzf "{{ file_name }}" -C "{{ extracted_dir_name }}" --strip-components 1
            rm "{{ file_name }}"
            mv "{{ extracted_dir_name }}" "{{ dest_path }}"
        else
            mv "{{ file_name }}" "{{ dest_path }}"
        fi
        rm "{{ log_file }}"
      args:
        executable: /bin/bash
        creates: "{{ dest_path }}"
      when: is_proot

  rescue:
    # We output summaries to a log file for the user's benefit,
    # but all of the errors necessarily show up there as well.
    # Here, we parse out the error message, ignoring almost all of
    # the summary lines, which could be a lot.
    # Finally, we exit 1 so Ansible shows this error.
    - name: "Error downloading {{ file_name }}"
      shell: |
        set -euo pipefail

        cd {{ working_dir }}

        echo "aria2c error:" 1>&2
        tac "{{ log_file }}" | sed '/'"Download Progress Summary as of"'/q' | tac 1>&2
        exit 1
      args:
        executable: /bin/bash
