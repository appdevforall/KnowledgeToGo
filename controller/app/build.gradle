plugins {
    id 'com.android.application'
    // ADFA-4466 Phase 1: Firebase Analytics. The google-services plugin fails the build when
    // google-services.json is absent, so it is applied CONDITIONALLY at the bottom of this file
    // (present -> Firebase on; absent -> AnalyticsClient compiles out and the build still works).
}

// 1. AUTO-VERSIONING MAP (Must be defined outside the 'android' block)
// Assigns a unique ID to each architecture so Version Codes do not collide.
ext.abiCodes = ['armeabi-v7a': 1, 'arm64-v8a': 2]

// ADFA-4787: make every build traceable to its commit. Reads the short git SHA (plus a "-dirty"
// marker for an unclean working tree) so LOCAL Android Studio builds are stamped too — CI still
// overrides this via -PversionSuffix. Degrades to "" if git isn't available (e.g. source tarball),
// so the build never fails.
def gitShortSha = {
    try {
        def sha = "git rev-parse --short HEAD".execute(null, rootProject.projectDir).text.trim()
        if (sha.isEmpty()) return ""
        def status = "git status --porcelain".execute(null, rootProject.projectDir).text.trim()
        return status.isEmpty() ? sha : sha + "-dirty"
    } catch (ignored) {
        return ""
    }
}
ext.gitSha = gitShortSha()

// Firebase is OPTIONAL for local/contributor builds. google-services.json holds the real project keys
// and is gitignored, so a fresh clone doesn't have it. When it's absent we skip the google-services
// plugin (which would otherwise fail the build) and flag AnalyticsClient off via BuildConfig so it never
// touches the uninitialized Firebase SDK. Set the file to enable analytics for a release build.
def hasGoogleServices = file("google-services.json").exists()

android {
    // 2. Identity
    namespace 'org.appdevforall.k2go'
    compileSdk 34
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "org.appdevforall.k2go"
        minSdk 24
        // VITAL FOR PROOT AND W^X! Do not go up unless strictly necessary
        targetSdk 28

        // 3. Version Control (OTA)
        // NOTE: With splits enabled, this number will be multiplied by 10 (e.g. 50 -> 500, 501, 502)
        versionCode 60
        // Dynamic version suffix: CI passes -PversionSuffix explicitly; local builds fall back to
        // the git short SHA (ADFA-4787) so any installed APK is traceable to its commit.
        def ciSuffix = project.hasProperty('versionSuffix') ? project.property('versionSuffix')
                : (project.ext.gitSha ? "-${project.ext.gitSha}" : "")
        versionName "v0.7.0-beta${ciSuffix}"
        buildConfigField "String", "GIT_SHA", "\"${project.ext.gitSha}\""
        // True only when google-services.json is present, so AnalyticsClient can compile out cleanly.
        buildConfigField "boolean", "ANALYTICS_ENABLED", "${hasGoogleServices}"

        setProperty("archivesBaseName", "$applicationId-$versionName")

        // 4. Supported architectures (NDK) - Dropping x86/x86_64
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    // 5. GENERATE MULTIPLE APKS (Splits)
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a"
            universalApk true // Also generates a fat APK with both architectures
        }
    }

    buildFeatures {
        buildConfig true
    }

    // 6. Updated to Java 17 (Required by modern libraries)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 7. Signature Engine (Automatic Signatures for OTA)
    signingConfigs {
        release {
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            // ADFA-4533: GlitchTip (Sentry) DSN from -PsentryDsnRelease or $SENTRY_DSN_RELEASE (empty -> SDK inert)
            manifestPlaceholders = [sentryDsn: (project.findProperty('sentryDsnRelease') ?: System.getenv('SENTRY_DSN_RELEASE') ?: '')]
        }
        debug {
            minifyEnabled false
            //signingConfig signingConfigs.release
            // ADFA-4533: GlitchTip (Sentry) DSN from -PsentryDsnDebug or $SENTRY_DSN_DEBUG (empty -> SDK inert)
            manifestPlaceholders = [sentryDsn: (project.findProperty('sentryDsnDebug') ?: System.getenv('SENTRY_DSN_DEBUG') ?: '')]
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        // Try to avoid clashes if Termux and our code contain duplicate licenses or metadata
        pickFirst 'META-INF/LICENSE'
        pickFirst 'META-INF/LICENSE.txt'
        pickFirst 'META-INF/NOTICE'
        pickFirst 'META-INF/NOTICE.txt'
        pickFirst 'META-INF/DEPENDENCIES'
    }

    // 8. Dynamic Keystore Loading
    def propsFile = rootProject.file('store.properties')
    def configName = 'release'

    if (propsFile.exists() && android.signingConfigs.hasProperty(configName)) {
        def props = new Properties()
        props.load(new FileInputStream(propsFile))
        if (props != null && props.containsKey('storeFile')) {
            android.signingConfigs[configName].storeFile = rootProject.file(props['storeFile'])
            android.signingConfigs[configName].storePassword = props['storePassword']
            android.signingConfigs[configName].keyAlias = props['keyAlias']
            android.signingConfigs[configName].keyPassword = props['keyPassword']
        }
    }

    lintOptions {
        checkReleaseBuilds false
        // Phase 0: lint is a hard gate for :app. The current backlog is grandfathered
        // via the committed baseline below, so existing issues don't block the build,
        // but any NEW lint error fails it. Shrink the baseline as the backlog is fixed.
        abortOnError true
        baseline file("lint-baseline.xml")
        // Missing translations are a HARD ERROR (ADFA-4453): lint now runs in minutes
        // (Fragment detectors re-enabled in ADFA-4443), so an incomplete locale must
        // fail fast and be completed rather than silently drift.
        error 'MissingTranslation'

        // androidx.fragment's UnsafeFragmentLifecycleObserverDetector (issue IDs
        // FragmentBackPressedCallback / FragmentLiveDataObserve / FragmentAddMenuProvider)
        // was disabled in #36: its recursive call-graph walk hit near-exponential cost on
        // the oversized DeployFragment and hung :app:lintDebug for hours. Re-enabled after
        // the DeployFragment carves (ADFA-1028) -- the observe / back-pressed / menu-provider
        // call sites no longer exist in any Fragment (they live in non-Fragment controllers
        // and in MainActivity, both out of these detectors' scope), so the detector has
        // nothing to walk. See controller/docs/TECH_DEBT_PLAN.md.
    }

    testOptions {
        unitTests {
            // Let JVM unit tests stub Android framework calls (e.g. android.util.Log)
            // so framework-free logic can be tested without an emulator.
            returnDefaultValues = true
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    // 9. DYNAMIC VERSIONING OVERRIDE
    // Applies the math algorithm to ensure unique Version Codes per APK split
    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            // Try to fetch the ABI code defined at the top of the file
            def baseAbiVersionCode = project.ext.abiCodes.get(output.getFilter(com.android.build.OutputFile.ABI))

            // If null, it's the Universal APK. We assign 0.
            if (baseAbiVersionCode == null) {
                baseAbiVersionCode = 0
            }

            // Multiply original version by 10 and add the architecture ID
            // Ex: Version 50 -> Universal: 500, ARM32: 501, ARM64: 502
            output.versionCodeOverride = (variant.versionCode * 10) + baseAbiVersionCode
        }
    }
}

dependencies {
    // ADFA-4533: GlitchTip (Sentry-compatible) crash reporting SDK.
    implementation 'io.sentry:sentry-android-core:8.29.0'

    // 10. Core dependencies
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.airbnb.android:lottie:6.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.webkit:webkit:1.12.0'

    // Presentation layer (Clean Architecture pilot): ViewModel + LiveData.
    // Java artifacts — no Kotlin required.
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    // ADFA-5061: SavedStateHandle. A ViewModel alone survives a configuration change but
    // not the system killing the app in the background — which on the low-RAM hardware this
    // targets is ordinary, not exotic, and the wizard is long enough to be caught by it.
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.8.7'
    implementation 'androidx.work:work-runtime:2.9.1'
    // WorkManager's Worker API returns guava ListenableFuture. Full guava (pulled by
    // :termux-core) forces the empty com.google.guava:listenablefuture stub to win
    // version resolution, leaving no ListenableFuture.class on this module's compile
    // classpath -> subclassing Worker fails to compile. Depend on full guava directly
    // (same version as :termux-core, deduped at runtime) so the real class is present.
    // See ADFA-4504.
    implementation 'com.google.guava:guava:31.1-jre'

    // IIAB Tools
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // ADFA-4466 Phase 1: Firebase Analytics (online-first). BoM aligns versions;
    // firebase-analytics (not -ktx) exposes the Java API used by AnalyticsClient.
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-analytics'

    // Local Module: Our C++ engine (Termux)
    implementation project(':termux-core')

    // Testing
    testImplementation 'junit:junit:4.13.2'
    // Real org.json so SyncHandshakeHelper JSON logic can run in JVM unit tests
    testImplementation 'org.json:json:20231013'
    // MockWebServer: JVM-level proof of the delivery HTTP contract (ADFA-4504).
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    // Drives the real OutboundSyncWorker on-device (ADFA-4504).
    androidTestImplementation 'androidx.work:work-testing:2.9.1'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

import groovy.json.JsonSlurper
import java.security.MessageDigest

// =========================================================
// IIAB SUPPLY CHAIN HOOK (GITHUB RELEASES SYNC)
// =========================================================
task syncNativeArtifacts {
    description = 'Downloads, extracts, and cryptographically verifies rolling native binaries'

    // Repo name
    def repoName = "appdevforall/KnowledgeToGo"

    // Work Directories
    def assetsDir = file("src/main/assets")
    def jniLibsDir = file("src/main/jniLibs")
    def zipFile = file("${buildDir}/termux-binaries-latest.zip")
    def unzipDir = file("${buildDir}/temp_artifacts")
    def tagTrackerFile = file("src/main/assets/current_binaries_tag.txt")

    // Helper to calculate SHA256
    def calculateSha256 = { File file ->
        def digest = MessageDigest.getInstance("SHA-256")
        file.withInputStream { is ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = is.read(buffer)) > 0) {
                digest.update(buffer, 0, read)
            }
        }
        return digest.digest().encodeHex().toString()
    }

    doLast {
        println ">> [IIAB Hook] Querying GitHub API for latest rolling release..."

        try {
            // Ensure assets directory exists
            if (!assetsDir.exists()) assetsDir.mkdirs()

            // 1. Read the pinned version from the anchor file
            def versionFile = rootProject.file("binary_version.txt")
            if (!versionFile.exists()) {
                throw new GradleException(">> [IIAB Hook] ERROR: Anchor file not found at ${versionFile.absolutePath}")
            }

            def targetTag = versionFile.text.trim()
            println "   -> Target tag pinned to: ${targetTag}"

            // 2. Smart caching FIRST -- never touch the network if the pinned
            //    binaries are already present and verified locally (M15: do not
            //    couple every build to the GitHub API).
            def slurper = new JsonSlurper()
            def currentTag = tagTrackerFile.exists() ? tagTrackerFile.text.trim() : ""

            // List all critical binaries that must exist
            def requiredBinaries = ["libaria2c.so", "libproot.so", "libtar.so", "libgzip.so", "libxz.so", "librsync.so", "libnano.so", "libless.so"]
            def requiredArchs = ["arm64-v8a", "armeabi-v7a"]
            def allBinariesExist = true

            // Loop through architectures and binaries to ensure 100% integrity
            for (arch in requiredArchs) {
                for (bin in requiredBinaries) {
                    if (!file("src/main/jniLibs/${arch}/${bin}").exists()) {
                        allBinariesExist = false
                        break // Exit inner loop on first missing file
                    }
                }
                if (!allBinariesExist) break // Exit outer loop
            }

            // We also verify that the manifest exists in order to be able to audit.
            def manifestFile = new File(assetsDir, "ninja_manifest.json")
            def isCached = (currentTag == targetTag && allBinariesExist && manifestFile.exists())

            if (isCached) {
                println "   -> [CACHED] Artifacts are up to date (${currentTag}) and physically present. Skipping API + download."
            } else {
                println "   -> Cache miss, missing physical files, or missing manifest. Proceeding with download..."

                // 3. Fetch release metadata. Try UNAUTHENTICATED first so a fork
                //    without a token still builds; only if that fails (e.g. HTTP 403
                //    rate-limit) retry WITH a token when one is available in the
                //    environment. Independent builds never need to define a token.
                def openReleaseConn = { String authToken ->
                    def relUrl = new URL("https://api.github.com/repos/${repoName}/releases/tags/${targetTag}")
                    def c = (HttpURLConnection) relUrl.openConnection()
                    c.setRequestProperty("Accept", "application/vnd.github.v3+json")
                    c.setRequestProperty("User-Agent", "iiab-android-build")
                    if (authToken?.trim()) c.setRequestProperty("Authorization", "Bearer ${authToken.trim()}")
                    return c
                }

                def connection = openReleaseConn(null) // attempt 1: unauthenticated
                int code = connection.responseCode
                if (code != 200) {
                    def envToken = System.getenv("GITHUB_TOKEN") ?: System.getenv("GH_TOKEN")
                    if (envToken?.trim()) {
                        println "   -> Unauthenticated API call returned HTTP ${code}; retrying with token (first attempt likely rate-limited)..."
                        connection = openReleaseConn(envToken) // attempt 2: authenticated fallback
                        code = connection.responseCode
                    }
                }
                if (code != 200) {
                    throw new GradleException(">> [IIAB Hook] GitHub API error for tag ${targetTag}: HTTP ${code}. " +
                            "This is usually GitHub API rate-limiting; set GITHUB_TOKEN (CI provides one automatically) to raise the limit.")
                }

                def targetRelease = slurper.parse(connection.inputStream)

                // 4. Find the zip asset URL in the targeted release
                def zipAsset = targetRelease.assets.find { it.name == 'termux-binaries-latest.zip' }
                if (zipAsset == null) {
                    throw new GradleException(">> [IIAB Hook] Zip asset not found in release ${targetRelease.tag_name}")
                }

                println "   -> Found matching binaries: ${targetRelease.tag_name}"
                println "   -> Downloading ZIP (approx ~15MB)..."

                // 5. Download the ZIP to the build/ directory
                if (!zipFile.parentFile.exists()) zipFile.parentFile.mkdirs()
                ant.get(src: zipAsset.browser_download_url, dest: zipFile, skipexisting: false)

                // 6. Extract the ZIP to a temporary folder
                println "   -> Extracting binaries..."
                if (unzipDir.exists()) unzipDir.deleteDir() // Clean temp folder
                copy {
                    from zipTree(zipFile)
                    into unzipDir
                }

                // 7. Route the files to their correct Android folders
                copy {
                    from "${unzipDir}/jniLibs"
                    into jniLibsDir
                }
                copy {
                    from unzipDir
                    include "cacert.pem", "ninja_manifest.json"
                    into assetsDir
                }

                // 8. Update our local tracker file with the new tag
                tagTrackerFile.text = targetRelease.tag_name
            }

            // --- 9. STRICT CRYPTOGRAPHIC AUDIT (SHA256) ---
            if (manifestFile.exists()) {
                println ">> [IIAB Hook] Performing strict SHA256 integrity audit..."
                def manifest = slurper.parse(manifestFile)

                // Iterate over each architecture in the JSON
                manifest.binaries.each { archName, binariesMap ->
                    binariesMap.each { binName, binMeta ->
                        def physicalBinFile = new File(jniLibsDir, "${archName}/${binName}")

                        if (!physicalBinFile.exists()) {
                            throw new GradleException(">> [IIAB Hook] INTEGRITY FATAL: Expected binary missing! -> ${archName}/${binName}")
                        }

                        def expectedSha = binMeta.sha256
                        def actualSha = calculateSha256(physicalBinFile)

                        if (expectedSha != actualSha) {
                            // IF THERE IS CORRUPTION, STOP THE COMPILATION IMMEDIATELY
                            throw new GradleException(">> [IIAB Hook] INTEGRITY FATAL: CORRUPTED BINARY DETECTED!\nFile: ${archName}/${binName}\nExpected: ${expectedSha}\nActual:   ${actualSha}")
                        }
                    }
                }
                println "   -> [OK] All binaries passed cryptographic SHA256 audit."
            } else {
                throw new GradleException(">> [IIAB Hook] INTEGRITY FATAL: ninja_manifest.json is missing! Cannot verify binaries.")
            }
            // ---------------------------------------------------

            println ">> [IIAB Hook] Successfully synced and verified native artifacts!"

        } catch (Exception e) {
            System.err.println ">> [IIAB Hook] ERROR: Failed to sync or verify artifacts"
            System.err.println ">> [IIAB Hook] Details: ${e.message}"
            // Throwing the exception ensures the build fails if critical binaries can't be verified
            throw new GradleException("Artifact sync/verification failed", e)
        }
    }
}

preBuild.dependsOn syncNativeArtifacts

// ---- ADFA-4593: tooltip three-tier help database ------------------------------
// Source of truth is tools/help/i18n (.pot + <lang>.po compiled to assets/help.db).
// Requires Python + polib for validation/compilation; if Python is absent the
// committed help.db is used and checks are skipped (so local builds never break).
def helpI18nDir = file("tools/help/i18n")
def helpDb = file("src/main/assets/help.db")
def helpRequiredLangs = "es,fr,hi,pt,ru,de,ja,ar,it,zh,ko,nl,tr,vi,pl,cs,in,fa,uk,ro,el,hu,sk,bg,sr,lt,no,az,bn,gu,ta,sw,yo"
def helpPython = (System.getProperty("os.name").toLowerCase().contains("win")
        ? ["py", "python", "python3"] : ["python3", "python"]).find { name ->
    try { def p = "${name} --version".execute(); p.waitFor(); p.exitValue() == 0 }
    catch (ignored) { false }
}

if (helpPython == null) {
    logger.warn("ADFA-4593: Python not found; using committed help.db and skipping tooltip "
            + "translation checks. Install Python + polib for full enforcement (required in CI).")
} else {
    tasks.register("validateHelpTranslations", Exec) {
        group = "help"
        description = "Fail the build if required tooltip translations are missing."
        inputs.dir helpI18nDir
        workingDir projectDir
        def allowMissing = project.hasProperty("helpAllowMissing") ? project.property("helpAllowMissing") : "false"
        commandLine helpPython, "tools/help/validate_help.py", "tools/help/i18n",
                "--required", helpRequiredLangs, "--allow-missing", allowMissing
    }
    tasks.register("buildHelpDb", Exec) {
        group = "help"
        description = "Compile the tooltip help.db from .po sources."
        inputs.dir helpI18nDir
        outputs.file helpDb
        dependsOn "validateHelpTranslations"
        workingDir projectDir
        commandLine helpPython, "tools/help/build_help_db.py", "tools/help/i18n", helpDb.absolutePath
    }
    tasks.register("smokeHelpTranslations", Exec) {
        group = "help"
        description = "Integrity smoke test for tooltip localizations (markup, encoding, round-trip)."
        inputs.dir helpI18nDir
        workingDir projectDir
        commandLine helpPython, "tools/help/smoke_help.py", "tools/help/i18n", "--langs", helpRequiredLangs
    }
    tasks.register("extractHelpPot", Exec) {
        group = "help"
        description = "Regenerate strings.pot from the English source (run on demand)."
        workingDir projectDir
        commandLine helpPython, "tools/help/extract_help_pot.py", "tools/help/i18n"
    }
    tasks.matching { it.name == "preBuild" }.configureEach { dependsOn "buildHelpDb" }
}
// ---- rootfs size auto-capture (offline fallback) ------------------------------
// Fetches the stable latest_<tier>_<abi>.meta4 <size> for each edition and writes
// src/main/assets/rootfs_sizes.csv, so the app's OFFLINE fallback (RootfsCatalog)
// is captured at package time instead of hand-maintained. Non-fatal: an incomplete
// fetch (offline build) keeps the committed CSV. Runs every build (no up-to-date
// cache) but only rewrites the file when a byte size actually changed, so identical
// sizes never dirty the working tree.
task refreshRootfsSizes {
    group = 'build setup'
    description = 'Capture rootfs image sizes (.meta4) into assets/rootfs_sizes.csv for the offline fallback'
    def csv = file('src/main/assets/rootfs_sizes.csv')
    doLast {
        // ADFA-5368: k2go-rootfs bucket, which serves from its root (switnet kept an /android/rootfs path).
        def base = 'https://pub-d64c885cef6c42db8c7925144d73d0ee.r2.dev/'
        def tiers = ['basic', 'standard', 'full']
        def abis = ['arm64-v8a', 'armeabi-v7a']
        def sizePat = ~/<size>(\d+)<\/size>/
        // ADFA-5105: capture BOTH the compressed download size (.meta4 <size>) and the
        // uncompressed installed size (.installed sidecar, ADFA-5110). The installed value is
        // what the destructive free-space guard needs; keep both columns in sync per build.
        def fetch = { String url ->
            def conn = (HttpURLConnection) new URL(url).openConnection()
            conn.setRequestProperty('User-Agent', 'iiab-android-build')
            conn.connectTimeout = 6000
            conn.readTimeout = 6000
            if (conn.responseCode != 200) { conn.disconnect(); return null }
            def body = conn.inputStream.getText('UTF-8')
            conn.disconnect()
            return body
        }
        def fetched = [:]
        def fetchedInst = [:]
        for (t in tiers) {
            for (a in abis) {
                try {
                    def meta = fetch("${base}latest_${t}_${a}.meta4")
                    def m = meta != null ? sizePat.matcher(meta) : null
                    if (m != null && m.find()) { fetched["${t}|${a}".toString()] = m.group(1) }
                    else { logger.warn(">> [rootfs sizes] no compressed size for ${t}/${a}") }
                    def inst = fetch("${base}latest_${t}_${a}.installed")
                    if (inst != null && inst.trim() ==~ /\d+/) { fetchedInst["${t}|${a}".toString()] = inst.trim() }
                    else { logger.warn(">> [rootfs sizes] no installed size for ${t}/${a}") }
                } catch (Exception e) {
                    logger.warn(">> [rootfs sizes] fetch failed for ${t}/${a}: ${e.message}")
                }
            }
        }
        def expected = tiers.size() * abis.size()
        if (fetched.size() != expected || fetchedInst.size() != expected) {
            logger.warn(">> [rootfs sizes] incomplete fetch (compressed ${fetched.size()}/${expected}, installed ${fetchedInst.size()}/${expected}); keeping existing ${csv.name} (last known).")
            return
        }
        def existing = [:]
        if (csv.exists()) {
            csv.eachLine { line ->
                line = line.trim()
                if (line.isEmpty() || line.startsWith('#')) return
                def p = line.split(',')
                if (p.length >= 5) existing["${p[0].trim()}|${p[1].trim()}".toString()] = "${p[2].trim()}|${p[4].trim()}".toString()
            }
        }
        def current = [:]
        for (t in tiers) for (a in abis) current["${t}|${a}".toString()] = "${fetched[("${t}|${a}").toString()]}|${fetchedInst[("${t}|${a}").toString()]}".toString()
        if (existing == current) {
            println ">> [rootfs sizes] up to date (${current.size()} entries unchanged)."
            return
        }
        def today = new Date().format('yyyy-MM-dd')
        def rows = []
        for (t in tiers) for (a in abis) {
            def k = "${t}|${a}".toString()
            rows << "${t},${a},${fetched[k]},${today},${fetchedInst[k]}".toString()
        }
        if (!csv.parentFile.exists()) csv.parentFile.mkdirs()
        csv.text = '# tier,abi,bytes,fetched_date,installed_bytes -- AUTO-GENERATED by the refreshRootfsSizes Gradle task; do not edit by hand\n' + rows.join('\n') + '\n'
        println ">> [rootfs sizes] updated ${rows.size()} entries in ${csv.name} (${today})."
    }
}

preBuild.dependsOn refreshRootfsSizes

// ---- proot module install-size auto-capture (ADFA-4958) -----------------------
// Parses the FULL build log's per-role "*_disk_usage = <bytes>" accounting into
// src/main/assets/module_sizes.csv (bytes per module), for the module detail's size
// chip (offline value; ModuleSizes reads it). matomo/maps are absent -> shown as NA.
// Resilient: a failed/empty fetch keeps the committed CSV; only rewrites on change.
task refreshModuleSizes {
    group = 'build setup'
    description = 'Capture per-module install sizes from the full build log into assets/module_sizes.csv'
    def csv = file('src/main/assets/module_sizes.csv')
    doLast {
        def url = 'https://pub-d64c885cef6c42db8c7925144d73d0ee.r2.dev/build-full-arm64-v8a.log'
        def wanted = ['kolibri', 'kiwix', 'calibreweb', 'code'] as Set
        def pat = ~/(\w+)_disk_usage\s*=\s*(\d+)/
        def fetched = [:]
        try {
            def conn = (HttpURLConnection) new URL(url).openConnection()
            conn.setRequestProperty('User-Agent', 'iiab-android-build')
            conn.connectTimeout = 8000
            conn.readTimeout = 20000
            if (conn.responseCode != 200) {
                logger.warn(">> [module sizes] HTTP ${conn.responseCode} for ${url}; keeping ${csv.name}")
                conn.disconnect(); return
            }
            def body = conn.inputStream.getText('UTF-8')
            conn.disconnect()
            def m = pat.matcher(body)
            while (m.find()) { if (wanted.contains(m.group(1))) fetched[m.group(1)] = m.group(2) }
        } catch (Exception e) {
            logger.warn(">> [module sizes] fetch failed (${e.message}); keeping ${csv.name}")
            return
        }
        if (fetched.isEmpty()) {
            logger.warn(">> [module sizes] no *_disk_usage matches; keeping ${csv.name}")
            return
        }
        def existing = [:]
        if (csv.exists()) {
            csv.eachLine { line ->
                line = line.trim()
                if (line.isEmpty() || line.startsWith('#')) return
                def p = line.split(',')
                if (p.length >= 2) existing[p[0].trim()] = p[1].trim()
            }
        }
        def merged = [:]; merged.putAll(existing); merged.putAll(fetched)
        if (existing == merged) {
            println ">> [module sizes] up to date (${fetched.size()} modules)."
            return
        }
        def today = new Date().format('yyyy-MM-dd')
        def rows = merged.sort { it.key }.collect { k, v -> "${k},${v},${today}".toString() }
        if (!csv.parentFile.exists()) csv.parentFile.mkdirs()
        csv.text = '# module,bytes,fetched_date -- AUTO-GENERATED by the refreshModuleSizes Gradle task; do not edit by hand\n' + rows.join('\n') + '\n'
        println ">> [module sizes] updated ${rows.size()} modules in ${csv.name} (${today})."
    }
}

preBuild.dependsOn refreshModuleSizes

// ---- maps layer size auto-capture (offline fallback) --------------------------
// Fetches the <size> from each map layer's .meta4 on the maps mirror and writes
// src/main/assets/maps_sizes.csv, so the Choose screen's OFFLINE fallback (MapsCatalog)
// is captured at package time instead of hand-maintained — same pattern as rootfs above.
// The file names follow roles/maps/defaults/main.yml; update the three data dates below
// when the role bumps them. Non-fatal: an incomplete fetch keeps the committed CSV.
task refreshMapsSizes {
    group = 'build setup'
    description = 'Capture map layer sizes (.meta4) into assets/maps_sizes.csv for the offline fallback'
    def csv = file('src/main/assets/maps_sizes.csv')
    doLast {
        def base = 'https://iiab.switnet.org/maps/2/'
        // Data dates from roles/maps/defaults/main.yml (maps_vector_data_date / maps_slow_data_date
        // / maps_search_data_date). Keep in sync with the role.
        def vectorDate = '2026-07-01'
        def slowDate = '2025-12-10'
        def searchDate = '2026-04-22'
        // "group|level" -> mirror file name (whole-world pmtiles; search is a tarball).
        def files = [
                'base|nat-z8'          : "naturalearth-openmaptiles.${slowDate}.z00-z08.pmtiles",
                'base|11'              : "openstreetmap-openmaptiles.${vectorDate}.z00-z11.pmtiles",
                'base|14'              : "openstreetmap-openmaptiles.${vectorDate}.z00-z14.pmtiles",
                'satellite|7'          : "s2maps-sentinel2-2023.${slowDate}.z00-z07.pmtiles",
                'satellite|9'          : "s2maps-sentinel2-2023.${slowDate}.z00-z09.pmtiles",
                'satellite|11'         : "s2maps-sentinel2-2023.${slowDate}.z00-z11.pmtiles",
                'satellite|13'         : "s2maps-sentinel2-2023.${slowDate}.z00-z13.pmtiles",
                'terrain|7'            : "terrarium.${slowDate}.z00-z07.pmtiles",
                'terrain|8'            : "terrarium.${slowDate}.z00-z08.pmtiles",
                'terrain|9'            : "terrarium.${slowDate}.z00-z09.pmtiles",
                'terrain|10'           : "terrarium.${slowDate}.z00-z10.pmtiles",
                'search|pop-1k-cities' : "static-search.${searchDate}.pop-1k-cities.tar.gz",
        ]
        def sizePat = ~/<size>(\d+)<\/size>/
        def fetched = [:]
        files.each { k, fname ->
            def url = "${base}${fname}.meta4"
            try {
                def conn = (HttpURLConnection) new URL(url).openConnection()
                conn.setRequestProperty('User-Agent', 'iiab-android-build')
                conn.connectTimeout = 6000
                conn.readTimeout = 6000
                if (conn.responseCode != 200) {
                    logger.warn(">> [maps sizes] HTTP ${conn.responseCode} for ${url}")
                    conn.disconnect(); return
                }
                def body = conn.inputStream.getText('UTF-8')
                conn.disconnect()
                def m = sizePat.matcher(body)
                if (m.find()) { fetched[k] = m.group(1) }
                else { logger.warn(">> [maps sizes] no <size> element in ${url}") }
            } catch (Exception e) {
                logger.warn(">> [maps sizes] fetch failed for ${url}: ${e.message}")
            }
        }
        if (fetched.size() != files.size()) {
            logger.warn(">> [maps sizes] incomplete fetch (${fetched.size()}/${files.size()}); keeping existing ${csv.name} (last known).")
            return
        }
        def existing = [:]
        if (csv.exists()) {
            csv.eachLine { line ->
                line = line.trim()
                if (line.isEmpty() || line.startsWith('#')) return
                def p = line.split(',')
                if (p.length >= 3) existing["${p[0].trim()}|${p[1].trim()}".toString()] = p[2].trim()
            }
        }
        if (existing == fetched) {
            println ">> [maps sizes] up to date (${fetched.size()} entries unchanged)."
            return
        }
        def today = new Date().format('yyyy-MM-dd')
        def rows = files.keySet().collect { k ->
            def gl = k.split('\\|', 2)
            "${gl[0]},${gl[1]},${fetched[k]},${today}".toString()
        }
        if (!csv.parentFile.exists()) csv.parentFile.mkdirs()
        csv.text = '# group,level,bytes,fetched_date -- AUTO-GENERATED by the refreshMapsSizes Gradle task; do not edit by hand\n' +
                '# Whole-world pmtiles from https://iiab.switnet.org/maps/2 (roles/maps/defaults dates).\n' +
                rows.join('\n') + '\n'
        println ">> [maps sizes] updated ${rows.size()} entries in ${csv.name} (${today})."
    }
}

preBuild.dependsOn refreshMapsSizes

// ---- Kiwix ZIM catalog refresh (release-only) ---------------------------------
// Regenerates src/main/assets/kiwix_catalog.csv from the Kiwix directory listings via
// tools/build_kiwix_catalog.py. Unlike the size tasks above it does NOT run on every build
// (the listings are large and the servers throttle bots) — it runs automatically only when
// assembling a RELEASE, and can be invoked manually any time: ./gradlew refreshKiwixCatalog.
// ADFA-5094: unlike Kolibri, Kiwix is NOT yet pulled from Cloudflare on-device (KiwixCatalog is
// not overlay-aware — that is Kiwix's phase 2), so release regeneration stays here as its only
// on-device freshness path until the runtime pull ships. The weekly workflow already publishes
// the Kiwix catalog to Cloudflare so phase 2 has something to consume.
// Never fails the build: if python3 is missing or the fetch is blocked, the committed CSV
// (last known) is kept.
task refreshKiwixCatalog {
    group = 'build setup'
    description = 'Regenerate assets/kiwix_catalog.csv from the Kiwix listings (release / manual)'
    doLast {
        try {
            def proc = ['python3', 'tools/build_kiwix_catalog.py'].execute(null, projectDir)
            proc.consumeProcessOutput(System.out, System.err)
            proc.waitFor()
            if (proc.exitValue() != 0) logger.warn(">> [kiwix catalog] generator exit ${proc.exitValue()}; kept existing CSV.")
        } catch (Exception e) {
            logger.warn(">> [kiwix catalog] skipped (${e.message}); kept existing CSV.")
        }
    }
}
tasks.matching { it.name == 'assembleRelease' || it.name == 'bundleRelease' }.configureEach {
    dependsOn refreshKiwixCatalog
}

// ---- Kolibri channel catalog refresh (manual only) ----------------------------
// Regenerates src/main/assets/kolibri_catalog.jsonl from Kolibri Studio's public API via
// tools/build_kolibri_catalog.py. Bundled rather than fetched on-device because Studio's
// channel endpoint is 97% base64 thumbnails with no way to opt out — 4.1 MB to use 119 KB
// (ADR-4954 D1). ADFA-5094: this no longer runs on release builds — the weekly publish-catalogs
// workflow generates the catalog off-device (Studio hit once a week, not per build) and the app
// pulls it from Cloudflare at runtime. The bundled JSONL is the offline floor; run this by hand
// only when you want to refresh that floor: ./gradlew refreshKolibriCatalog. Never fails the
// build: on any error the committed JSONL (last known) is kept.
task refreshKolibriCatalog {
    group = 'build setup'
    description = 'Regenerate assets/kolibri_catalog.jsonl from Kolibri Studio (manual)'
    doLast {
        try {
            def proc = ['python3', 'tools/build_kolibri_catalog.py'].execute(null, projectDir)
            proc.consumeProcessOutput(System.out, System.err)
            proc.waitFor()
            if (proc.exitValue() != 0) logger.warn(">> [kolibri catalog] generator exit ${proc.exitValue()}; kept existing JSONL.")
        } catch (Exception e) {
            logger.warn(">> [kolibri catalog] skipped (${e.message}); kept existing JSONL.")
        }
    }
}

// ADFA-5361: `connectedAndroidTest` UNINSTALLS both APKs when it finishes. On a device that holds an
// installed rootfs, uninstalling the app deletes its data directory — that is, the whole box. Observed:
// one run wiped an installed system on a test device. The instrumentation tests are worth keeping, so
// the fix is to refuse the destructive entry point rather than to write a rule someone has to remember.
// Install and run explicitly instead (this installs, runs, and leaves both APKs in place):
//     ./gradlew :app:installDebug :app:installDebugAndroidTest
//     adb shell am instrument -w -e class <TestClass> org.appdevforall.k2go.test/androidx.test.runner.AndroidJUnitRunner
// A device with nothing to lose can still opt in with -PallowUninstall=true.
tasks.configureEach { t ->
    if (t.name.startsWith('connected') && t.name.endsWith('AndroidTest')) {
        t.doFirst {
            if (!project.hasProperty('allowUninstall')) {
                throw new GradleException(
                        "Refusing to run ${t.name}: it uninstalls the app when it finishes, which on a "
                        + "device holding an installed rootfs destroys the box (ADFA-5361).\n"
                        + "  Run instead:\n"
                        + "    ./gradlew :app:installDebug :app:installDebugAndroidTest\n"
                        + "    adb shell am instrument -w -e class <TestClass> \\\n"
                        + "      org.appdevforall.k2go.test/androidx.test.runner.AndroidJUnitRunner\n"
                        + "  Or, if this device has nothing to lose: -PallowUninstall=true")
            }
        }
    }
}

// ADFA-4466 / build resilience: apply the Firebase google-services plugin only when its config file is
// present. Without it the plugin fails the build; skipping it lets contributors build a working APK with
// analytics compiled out (BuildConfig.ANALYTICS_ENABLED = false). Applied at the bottom, as the plugin
// expects, so it processes the already-configured android block.
if (hasGoogleServices) {
    apply plugin: 'com.google.gms.google-services'
    logger.lifecycle("K2Go: google-services.json found — Firebase Analytics enabled.")
} else {
    logger.lifecycle("K2Go: google-services.json not found — building WITHOUT Firebase (analytics disabled).")
}
