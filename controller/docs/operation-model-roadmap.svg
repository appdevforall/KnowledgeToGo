<text class="item" x="40" y="289">EnvironmentLock.isBusyNow()</text>
<text class="item" x="274" y="289">4 in-memory sources</text>
<text class="item" x="494" y="289">those sources</text>
<text class="item" x="684" y="289">staleness</text>
<text class="item" x="900" y="289">~30s stale</text>
<text class="item" x="1010" y="289" fill="#1B7F4B">ADFA-5146: expires ~30s</text>
<text class="item" x="40" y="306">installed_tier</text>
<text class="item" x="274" y="306">SharedPreferences</text>
<text class="item" x="494" y="306">the install</text>
<text class="item" x="684" y="306">nobody</text>
<text class="item" x="900" y="306">never</text>
<text class="item" x="1010" y="306" fill="#C0392B">no lifecycle</text>
<text class="item" x="40" y="323">content sessions</text>
<text class="item" x="274" y="323">statics inside services</text>
<text class="item" x="494" y="323">the services</text>
<text class="item" x="684" y="323">on replace (ADFA-5070)</text>
<text class="item" x="900" y="323">the process</text>
<text class="item" x="1010" y="323" fill="#1B7F4B">ADFA-5070: wiped on replace</text>
<text class="item" x="40" y="340">EnvironmentLock.ownerHeld</text>
<text class="item" x="274" y="340">file + session token</text>
<text class="item" x="494" y="340">deep ops</text>
<text class="item" x="684" y="340">self-heals on the next read</text>
<text class="item" x="900" y="340">-</text>
<text class="item" x="1010" y="340" fill="#1B7F4B">the pattern to copy</text>
<text class="item" x="40" y="357">installed modules</text>
<text class="item" x="274" y="357">local_vars.yml inside the rootfs</text>
<text class="item" x="494" y="357">the installer</text>
