<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1400" width="1240" height="1400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title>Operation model - ticket map, status and the standing directive</title>
<desc>Three columns that mean delivered / in flight / next. Rewritten 25 Sep 2026 to reflect delivery: 31 of 34 tickets are done, 3 are still open. Done cards keep their original ADFA key (Jira redirects an old ADFA key to its current K2GO key); open work is shown with its current K2GO key (K2GO-4, K2GO-255, K2GO-235). Flip a dot's class as work lands: s-done, s-doing, s-todo.</desc>
<style>
  .bg    { fill: #F7F8F9; }
  .card  { fill: #FFFFFF; stroke: #D5D8DC; stroke-width: 1.5; rx: 10; }
  .h1    { font-size: 19px; font-weight: 700; fill: #1F2328; }
  .h2    { font-size: 14.5px; font-weight: 700; fill: #1F2328; }
  .h3    { font-size: 11.5px; font-weight: 700; fill: #5B636B; letter-spacing: .05em; }
  .sub   { font-size: 11.5px; fill: #5B636B; }
  .item  { font-size: 11.5px; fill: #1F2328; }
  .note  { font-size: 11px; fill: #5B636B; font-style: italic; }
  .lnklbl{ font-size: 10px; fill: #5B636B; }
  .lnk    { stroke: #9AA0A6; stroke-width: 1.6; fill: none; }
  .s-done { fill: #1B7F4B; stroke: none; }
  .s-doing{ fill: #C77700; stroke: none; }
  .s-todo { fill: #FFFFFF; stroke: #9AA0A6; stroke-width: 1.5; }
  .chip   { rx: 9; }
  .chiptx { font-size: 10.5px; font-weight: 700; }
</style>
<defs>
  <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,1 L8,4.5 L0,8 Z" fill="#9AA0A6"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1240" height="1400"/>
<text class="h1" x="24" y="34">Operation model - ticket map</text>
<text class="sub" x="24" y="54">A card's column is its status: delivered, in flight, next. Almost everything shipped: 31 of 34 delivered, 3 still open.</text>
<text class="sub" x="24" y="72">Done cards keep their original ADFA key (Jira redirects it to the current K2GO). Open work uses the current K2GO key.</text>

<rect class="card" x="24" y="92" width="1192" height="300" stroke="#0E7C86" stroke-width="3"/>
<rect class="chip" x="40" y="108" width="132" height="19" fill="#E0F2F1" stroke="none"/>
<text class="chiptx" x="48" y="122" fill="#0E7C86">STANDING DIRECTIVE</text>
<text class="h2" x="188" y="123">One fact, one place, with an owner and a lifetime</text>
<text class="item" x="40" y="150">The app's state is scattered and undeclared. A dozen facts live in preferences, in files, in in-memory singletons and inside the rootfs, and nothing says who writes each one, who</text>
<text class="item" x="40" y="167">clears it, or what happens if the process dies between the two. That is not a tidiness complaint: four of the seven dead ends in state-spine.svg are the same sentence, a fact with no lifecycle.</text>
<text class="item" x="40" y="184">The rule, from here on: a change that touches a fact leaves it with a named owner and a stated lifetime, and updates the row below. Not a cleanup ticket for later, but refactor-by-feature,</text>
<text class="item" x="40" y="201">the way the layering already spreads. The two "pattern to copy" rows put the fact where its own destruction takes it with it, so nothing has to remember to invalidate anything.</text>
<text class="h3" x="40" y="232">FACT</text>
<text class="h3" x="274" y="232">WHERE IT LIVES</text>
<text class="h3" x="494" y="232">WHO WRITES IT</text>
<text class="h3" x="684" y="232">WHO CLEARS IT</text>
<text class="h3" x="900" y="232">DIES WITH</text>
<text class="h3" x="1010" y="232">STATUS</text>
<line x1="40" y1="238" x2="1200" y2="238" stroke="#D5D8DC"/>
