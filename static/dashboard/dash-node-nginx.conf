# K2Go REST core (ADFA-4933). Localhost-only; nginx fronts the Node engine on :4000.
#
# The REST engine used to be mounted at the root /api, which collided with Kolibri's
# /api under the shared :8085 server (nginx precedence sent every /api to us, so
# Kolibri 404'd). It is now namespaced under /k2go-api, leaving the root /api free.
# The legacy web dashboard UI (/dashboard + socket.io) was retired (ADFA-4933): the
# app talks to this engine over REST only, so no HTML/websocket surface is exposed.
location ^~ /k2go-api/ {
    # Basic security (localhost only)
    allow 127.0.0.1;
    allow ::1;
    deny all;

    # Show 404 all the time
    error_page 403 =404 /404.html;

    proxy_pass http://127.0.0.1:4000/api/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# php-fpm liveness probe (K2GO-381, ADR-5343a §10). The service-heal watcher HEADs this on
# loopback so the request runs through fastcgi into php-fpm: a healthy pool answers 200, a
# down/wedged/orphaned pool yields 502/504/timeout -> classified `down` -> `pdsm restart php-fpm`.
# The served file is our own side-effect-free health.php, deployed with the dashboard to
# /library/dashboard; `php` is the upstream iiab defines in nginx.conf (http scope). Loopback-only
# (same guard as /k2go-api) so a captive-portal client can neither reach nor probe it.
location = /k2go-php-health {
    allow 127.0.0.1;
    allow ::1;
    deny all;

    # Show 404 all the time (hide the endpoint from non-loopback).
    error_page 403 =404 /404.html;

    include fastcgi_params;
    fastcgi_pass php;
    fastcgi_param SCRIPT_FILENAME /library/dashboard/health.php;
}
