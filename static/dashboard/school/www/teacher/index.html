<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>K2Go School: teacher</title>
<link rel="stylesheet" href="../view.css">
<style>
  /* The color tokens of the app (res/values/colors.xml and values-night, K2G-3):
     --bg surface_background, --fg text_primary, --accent accent, --head-fg text_on_accent.
     --head is accent, and accent_muted at night: white on the night accent is 2.8:1, under the
     WCAG AA 4.5:1 of the 14 px text of the head bar. --page stays white: the lesson pages are light. */
  /* --chip surface_card, --chip-fg text_primary, --done status_success (debug only; --done-fg
     text_on_accent, at night text_on_warning), --ok --slow --bad
     status_success, status_warning, status_danger. --note: chrome_surface and chrome_on_surface,
     dark in both modes (a snackbar). --mark: the color of the marker, fixed (marks.js). */
  :root { --bg: #F4F5F7; --fg: #202124; --head: #2E7D32; --head-fg: #FFFFFF; --chip: #FFFFFF; --chip-fg: #202124;
    --done: #2E7D32; --done-fg: #FFFFFF; --note: #1A1A1A; --note-fg: #FFFFFF; --page: #fff; --accent: #2E7D32;
    --ok: #2E7D32; --slow: #E65100; --bad: #C62828; --mark: #FFD500; --mark-fg: #111; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --fg: #FAFAFA; --head: #2E5A30; --chip: #1E1E1E; --chip-fg: #FAFAFA; --done: #66BB6A;
      --done-fg: #212121; --accent: #4CAF50; --ok: #66BB6A; --slow: #FFB300; --bad: #EF5350; }
  }
  html, body { margin: 0; height: 100%; font: 14px/1.3 sans-serif; background: var(--bg); color: var(--fg); }
  body { display: flex; flex-direction: column; }
  /* The header: one row of icon buttons (tap targets of 40 px, also on a small phone, Nokia 6:
     360 x 640) and one status line. Notes, the seats of a group and the end question float over the
     page: the header keeps its height, so the page does not move under the finger. */
  header { position: relative; z-index: 6; padding: 2px 6px 4px; background: var(--head); color: var(--head-fg); }
  header input { font: inherit; width: 9em; }
  #bar { display: flex; align-items: center; gap: 2px; }
  #end { margin-inline-start: auto; }   /* the end of the bar, also right to left */
  button.icon { width: 40px; height: 40px; margin: 0; padding: 0; display: inline-flex; align-items: center;
    justify-content: center; border: 1px solid transparent; border-radius: 8px; background: none; color: inherit; }
  button.icon svg { width: 24px; height: 24px; fill: currentColor; }
  button.icon:disabled { opacity: 0.35; }
  button.icon[aria-pressed="true"] { background: var(--mark); color: var(--mark-fg); border-color: var(--mark-fg); }
  .sep { width: 1px; height: 24px; margin: 0 4px; background: currentColor; opacity: 0.3; }
  #line { display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; min-height: 22px; }
  #status { display: flex; flex-wrap: wrap; gap: 0 2px; align-items: center; }
  /* The status groups are chips on the head bar: the lights keep their color on any bar. */
  #status { gap: 4px; }
  #status button { display: inline-flex; align-items: center; gap: 4px; min-height: 24px; padding: 0 8px; border-radius: 12px;
    border: 1px solid transparent; background: var(--chip); color: var(--chip-fg); font: inherit; }
  #status button[aria-pressed="true"] { background: var(--mark); color: var(--mark-fg); border-color: var(--mark-fg); }
  #status button[aria-pressed="true"] .light { box-shadow: 0 0 0 1px var(--mark-fg); }   /* a light on the yellow chip */
  #status b { font-variant-numeric: tabular-nums; }
  .light { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
  .light.ok { background: var(--ok); }
  .light.slow { background: var(--slow); }
  .light.bad { background: var(--bad); }
  .pop { position: absolute; left: 6px; right: 6px; top: 100%; margin-top: 4px; padding: 6px 10px; border-radius: 8px;
    background: var(--note); color: var(--note-fg); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35); }
  .pop .pill { margin: 8px 0 0; margin-inline-end: 8px; background: var(--head); color: var(--head-fg); border-color: var(--head); }
  .pop .pill.quiet { background: transparent; color: inherit; border-color: currentColor; }
  #toast { position: absolute; left: 12px; right: 12px; bottom: 16px; z-index: 5; display: flex; align-items: center;
    gap: 8px; padding: 8px 12px; border-radius: 8px; background: var(--note); color: var(--note-fg);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35); }
  #toast button { margin-inline-start: auto; }
  /* The eraser: "Clear all" in a small chip at a top corner, not a note over the bottom lines. */
  #clearAll { position: absolute; top: 8px; inset-inline-end: 8px; z-index: 5; min-height: 36px; padding: 4px 12px;
    font: inherit; border: 1px solid var(--mark-fg); border-radius: 18px; background: var(--mark); color: var(--mark-fg);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35); }
  /* Right to left: the arrows of Back and End class point the other way. */
  [dir="rtl"] #back svg, [dir="rtl"] #end svg { transform: scaleX(-1); }
  #students span { display: inline-block; margin: 2px 4px 0 0; padding: 0 4px; background: var(--chip); color: var(--chip-fg); border-radius: 3px; }
  #students span.done { background: var(--done); color: var(--done-fg); }
  #students span.off { opacity: 0.5; }
  #stats { white-space: pre; font: 12px monospace; }
</style>
</head>
<body>
<header>
  <!-- Icons, not words: less text to translate, less height. Each button has a label for screen readers (data-a).
       The icons are Material Symbols (Outlined, weight 400, 24 px; Apache License 2.0,
       github.com/google/material-design-icons). data-icon is the name of the symbol. -->
  <div id="bar">
    <button id="library" class="icon" data-a="library"><svg viewBox="0 -960 960 960" data-icon="menu_book" aria-hidden="true"><path d="M560-564v-68q33-14 67.5-21t72.5-7q26 0 51 4t49 10v64q-24-9-48.5-13.5T700-600q-38 0-73 9.5T560-564Zm0 220v-68q33-14 67.5-21t72.5-7q26 0 51 4t49 10v64q-24-9-48.5-13.5T700-380q-38 0-73 9t-67 27Zm0-110v-68q33-14 67.5-21t72.5-7q26 0 51 4t49 10v64q-24-9-48.5-13.5T700-490q-38 0-73 9.5T560-454ZM260-320q47 0 91.5 10.5T440-278v-394q-41-24-87-36t-93-12q-36 0-71.5 7T120-692v396q35-12 69.5-18t70.5-6Zm260 42q44-21 88.5-31.5T700-320q36 0 70.5 6t69.5 18v-396q-33-14-68.5-21t-71.5-7q-47 0-93 12t-87 36v394Zm-40 118q-48-38-104-59t-116-21q-42 0-82.5 11T100-198q-21 11-40.5-1T40-234v-482q0-11 5.5-21T62-752q46-24 96-36t102-12q58 0 113.5 15T480-740q51-30 106.5-45T700-800q52 0 102 12t96 36q11 5 16.5 15t5.5 21v482q0 23-19.5 35t-40.5 1q-37-20-77.5-31T700-240q-60 0-116 21t-104 59ZM280-494Z"/></svg></button>
    <button id="back" class="icon" data-a="back" disabled><svg viewBox="0 -960 960 960" data-icon="arrow_back" aria-hidden="true"><path d="m313-440 224 224-57 56-320-320 320-320 57 56-224 224h487v80H313Z"/></svg></button>
    <span class="sep"></span>
    <button id="markPen" class="icon" data-a="markPen" aria-pressed="false" disabled><svg viewBox="0 -960 960 960" data-icon="ink_highlighter" aria-hidden="true"><path d="M544-400 440-504 240-304l104 104 200-200Zm-47-161 104 104 199-199-104-104-199 199Zm-84-28 216 216-229 229q-24 24-56 24t-56-24l-2-2-26 26H60l126-126-2-2q-24-24-24-56t24-56l229-229Zm0 0 227-227q24-24 56-24t56 24l104 104q24 24 24 56t-24 56L629-373 413-589Z"/></svg></button>
    <button id="markBox" class="icon" data-a="markBox" aria-pressed="false" disabled><svg viewBox="0 -960 960 960" data-icon="crop_square" aria-hidden="true"><path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm0 0v-560 560Z"/></svg></button>
    <button id="markOval" class="icon" data-a="markOval" aria-pressed="false" disabled><svg viewBox="0 -960 960 960" data-icon="circle" aria-hidden="true"><path d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></svg></button>
    <button id="markEraser" class="icon" data-a="markEraser" aria-pressed="false" disabled><svg viewBox="0 -960 960 960" data-icon="ink_eraser" aria-hidden="true"><path d="M690-240h190v80H610l80-80Zm-500 80-85-85q-23-23-23.5-57t22.5-58l440-456q23-24 56.5-24t56.5 23l199 199q23 23 23 57t-23 57L520-160H190Zm296-80 314-322-198-198-442 456 64 64h262Zm-6-240Z"/></svg></button>
    <button id="end" class="icon" data-a="endClass"><svg viewBox="0 -960 960 960" data-icon="door_open" aria-hidden="true"><path d="M440-440q17 0 28.5-11.5T480-480q0-17-11.5-28.5T440-520q-17 0-28.5 11.5T400-480q0 17 11.5 28.5T440-440ZM280-120v-80l240-40v-445q0-15-9-27t-23-14l-208-34v-80l220 36q44 8 72 41t28 77v512l-320 54Zm-160 0v-80h80v-560q0-34 23.5-57t56.5-23h400q34 0 57 23t23 57v560h80v80H120Zm160-80h400v-560H280v560Z"/></svg></button>
  </div>
  <div id="line">
    <span id="code"></span>
    <span id="status" translate="no">
      <button data-group="ok" aria-pressed="false"><i class="light ok"></i><span class="label"></span> <b>0</b></button>
      <button data-group="slow" aria-pressed="false"><i class="light slow"></i><span class="label"></span> <b>0</b></button>
      <button data-group="bad" aria-pressed="false"><i class="light bad"></i><span class="label"></span> <b>0</b></button>
      <button data-group="done" aria-pressed="false"><span class="label"></span> <b>0/0</b></button>
    </span>
  </div>
  <!-- The seats of the group that the teacher tapped. -->
  <div id="seats" class="pop" translate="no" hidden></div>
  <div id="confirm" class="pop" hidden>
    <span data-t="endConfirm"></span><br>
    <button id="endYes" class="pill small" data-t="endClass"></button>
    <button id="endNo" class="pill small quiet" data-t="cancel"></button>
  </div>
  <!-- Test tools (?debug=1): not for a class. The round trip of each seat is here. -->
  <div id="debug" hidden>
    <div id="students"></div>
    <button data-path="/kiwix/content/k2go_welcome/A/index.html">Welcome</button>
    <button data-path="/info/FAQ.html">Long page</button>
    <input id="path" placeholder="/kiwix/content/...">
    <button id="go">Open</button>
    <button id="auto">Auto-scroll</button>
    <button id="lag">Lag test</button>
    <div id="stats"></div>
  </div>
</header>
<div id="stage">
  <!-- Notes float over the page and go away by themselves; an open tool keeps its own. -->
  <div id="toast" role="status" hidden><span id="toastText"></span><button id="toastAction" class="pill small quiet" hidden></button></div>
  <button id="clearAll" hidden></button>
  <!-- Exit: the app closes the class screen at this address (as its X); a browser goes to the library. -->
  <div id="ended" hidden>
    <p data-t="ended"></p>
    <a id="exit" class="pill" href="../exit"><svg viewBox="0 -960 960 960" data-icon="door_open" aria-hidden="true"><path d="M440-440q17 0 28.5-11.5T480-480q0-17-11.5-28.5T440-520q-17 0-28.5 11.5T400-480q0 17 11.5 28.5T440-440ZM280-120v-80l240-40v-445q0-15-9-27t-23-14l-208-34v-80l220 36q44 8 72 41t28 77v512l-320 54Zm-160 0v-80h80v-560q0-34 23.5-57t56.5-23h400q34 0 57 23t23 57v560h80v80H120Zm160-80h400v-560H280v560Z"/></svg><span data-t="exit"></span></a>
    <button id="again" class="pill quiet" data-t="startAgain"></button>
  </div>
</div>
<script src="../text.js"></script>
<script src="../anchor.js"></script>
<script src="../follow.js"></script>
<script src="../marks.js"></script>
<script>
'use strict';
(function () {
  var stage = document.getElementById('stage');
  var clearAllBtn = document.getElementById('clearAll');
  var codeEl = document.getElementById('code');
  var seatsEl = document.getElementById('seats');
  var studentsEl = document.getElementById('students');
  var statsEl = document.getElementById('stats');
  var toastEl = document.getElementById('toast');
  var toastText = document.getElementById('toastText');
  var toastAction = document.getElementById('toastAction');
  var backBtn = document.getElementById('back');
  var confirmEl = document.getElementById('confirm');
  var HZ = parseInt(School.params.get('hz'), 10) || 20;
  var DEBUG = School.params.get('debug') === '1';
  // The words come from text.js, in the language of this page; the class carries it to the
  // students (live?lang=).
  SchoolText.apply(document);
  document.documentElement.dir = SchoolText.dir();   // the header and the notes
  var t = SchoolText.text;
  // The icon buttons: their words for a screen reader (and a mouse pointer on a PC).
  document.querySelectorAll('[data-a]').forEach(function (el) {
    el.setAttribute('aria-label', t(el.getAttribute('data-a')));
    el.title = t(el.getAttribute('data-a'));
  });
  function seatLabel(n) { return t('seat', (n < 10 ? '0' : '') + n); }
  // The status groups: the word on the line, and the sentence that lists the seats of the group.
  var GROUP_WORD = { ok: 'ok', slow: 'slow', bad: 'bad', done: 'done' };
  var GROUP_SEATS = { ok: 'seatsOk', slow: 'seatsSlow', bad: 'seatsBad', done: 'seatsNotDone' };
  // The status of a seat (the status line). The box marks a student quiet after 12 s with no word
  // (class.ts QUIET_MS). Rehearsal round trip publish -> ack: p50 69 ms, p95 320 ms, p99 504 ms.
  //   bad:  channel closed, quiet, the page is not the same, or a message of the teacher not acked
  //         for BEHIND_MS (the student does not follow: for example a page that does not load).
  //   slow: the median of the last RTT_COUNT round trips is over SLOW_MS.
  //   ok:   the rest.
  var SLOW_MS = 500;
  var BEHIND_MS = 15000;
  var RTT_COUNT = 5;
  // B2: the page renders at most every RENDER_MS, not on each ack (57 acks a second with 30
  // students), and each second for the statuses that change with time.
  var RENDER_MS = 250;
  // The teacher chooses a book in the Kiwix library; the class follows the pages of the books.
  var LIBRARY = '/kiwix/';

  var seq = 0;
  var sentAt = {};          // seq -> send time (ms), to measure the round trip
  var roster = [];          // from the box: the one owner of who is in the class (seats)
  // seat -> { rtts: last round trips (ms), match: false when its page is not the same,
  //           waiting: send time of the oldest message that it did not ack, or null }. From acks.
  var seen = {};
  var group = null;         // the group whose seats show (a tap on the status line)
  var lagRun = null;        // { rtts: { seat label: [ms] } } while a lag test runs
  var metrics = { renders: 0, events: 0 };   // debug: the render rate (B2)
  window.k2goTeacherMetrics = metrics;
  var sendQueued = false;  // a publish of the scroll waits (onScroll)
  var lastSend = 0;
  var started = false;      // the first page is open (the lesson of the box, or the start page)
  var byTimer = false;      // the start page came from the time-out: send nothing until the box answers
  var resumeAt = null;      // the anchor of the box lesson, applied when its page loads
  var publishable = false;  // the page on the screen can go to the class (a content page, no error)
  var pageGen = 0;          // page loads: a late status check of an older page does nothing
  var trail = [];           // the pages that the teacher opened, for Back
  // Marks (M2). The box keeps the marks of the lesson page; this page draws what the box sends and
  // sends each change to the box.
  var marks = { url: null, list: [] };
  var painted = { doc: null, layer: null, drawn: [] };
  var tool = null;          // the mark tool that is on (state of this page only): null, 'pen', 'box', 'oval' or 'eraser'
  var drag = null;          // the drag of a tool (onPointerDown)
  var dragSent = false;     // a drag sent a mark: the click that a mouse makes after it marks nothing
  var pendingMark = null;   // the mark of the last drag, shown until the box answers: { mark, moves: id or null }
  var tapEndsSelection = false;
  var toolBtns = {
    pen: document.getElementById('markPen'),
    box: document.getElementById('markBox'),
    oval: document.getElementById('markOval'),
    eraser: document.getElementById('markEraser')
  };
  // The teacher ended the class. The mark outlives the page: the app loads the teacher page again
  // after a theme change (seconds), and that must not open a new class. The mark holds the last time
  // that an end screen was alive (written each ENDED_BEAT_MS while it shows) and counts for ENDED_MS
  // only: the next "Teach a class" opens a class (review I1). Exit and "Start a new class" remove it;
  // the X of the app runs no page code, so the time ends it.
  var ENDED_KEY = 'k2go-school-ended';
  var ENDED_MS = 5 * 60 * 1000;
  var ENDED_BEAT_MS = 60 * 1000;
  var endedBeat = null;
  var ended = false;
  try {
    var endedAt = Number(localStorage.getItem(ENDED_KEY));
    ended = Date.now() - endedAt >= 0 && Date.now() - endedAt < ENDED_MS;
    if (!ended) { localStorage.removeItem(ENDED_KEY); }
  } catch (e) { ended = false; }
  function markEnded() {
    try { localStorage.setItem(ENDED_KEY, String(Date.now())); } catch (e) { /* no storage: a reload opens a class */ }
  }
  function forgetEnded() {
    clearInterval(endedBeat);   // a beat after Exit must not write the mark again
    try { localStorage.removeItem(ENDED_KEY); } catch (e) { /* no storage */ }
  }

  var view = School.view(stage, onReady);

  // A note floats over the page and goes away after NOTE_MS. keep: it stays until the next note.
  // action: { label, run } shows a button in the note.
  // A short note over a kept connection note shows the connection note again when it goes.
  // No text: the connection note while the channel is down, else no note (review M3).
  var NOTE_MS = 4000;
  var noteTimer = null;
  var connText = '';   // the state of the channel to the box, while it is not open
  function note(text, keep, action) {
    clearTimeout(noteTimer);
    if (!text && connText) { text = connText; keep = true; action = null; }
    if (toastText.textContent !== (text || '')) { toastText.textContent = text || ''; }
    toastEl.hidden = !text;
    toastAction.hidden = !action;
    if (action) {
      toastAction.textContent = action.label;
      toastAction.onclick = action.run;
    }
    if (text && !keep) {
      noteTimer = setTimeout(function () { note(''); }, NOTE_MS);
    }
  }

  function setConn(text) {
    var was = connText;
    connText = text;
    if (text) { note(text, true); } else if (was && toastText.textContent === was) { note(''); }
  }

  // The Kiwix library opens a book in its viewer, at viewer#<book>/<path>, which shows the book in
  // an inner frame. The class follows the content page itself (rehearsal F1: the viewer path
  // sent the students to the library in a loop). u: a Location or a URL.
  function contentOf(u) {
    if (!/^\/kiwix\/viewer\/?$/.test(u.pathname) || u.hash.length < 2) { return null; }
    return '/kiwix/content/' + u.hash.slice(1);
  }

  // The library, also its page for browsers with no JavaScript.
  function isLibrary(pathname) { return /^\/kiwix(\/|\/nojs(\/.*)?)?$/.test(pathname); }

  // The HTTP status of the page in the frame. responseStatus is in Chrome 109 and later; an older
  // WebView asks the box again.
  function checkStatus(win, done) {
    var nav = win.performance && win.performance.getEntriesByType ? win.performance.getEntriesByType('navigation')[0] : null;
    if (nav && nav.responseStatus) { done(nav.responseStatus); return; }
    fetch(win.location.pathname + win.location.search, { method: 'HEAD', cache: 'no-store' })
      .then(function (r) { done(r.status); }, function () { done(0); });
  }

  function publish() {
    if (byTimer || !publishable || ended) { return; }   // byTimer: the box lesson can still come
    var win = view.win();
    seq += 1;
    var msg = { seq: seq, url: view.path(), a: SchoolAnchor.anchorOf(win) };
    var now = performance.now();
    sentAt[seq] = now;
    delete sentAt[seq - 500];
    lastSend = now;
    roster.forEach(function (s) {
      var st = seatData(s.seat);
      if (st.waiting === null) { st.waiting = now; }
    });
    fetch('publish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(msg)
    }).catch(function () { note(t('boxNotReachable')); });   // the channel owns connText
  }

  // Send at most HZ messages a second, and always the last position.
  function onScroll() {
    if (sendQueued) { return; }
    sendQueued = true;
    var wait = Math.max(0, 1000 / HZ - (performance.now() - lastSend));
    setTimeout(function () { sendQueued = false; publish(); }, wait);
  }

  // A link in the lesson opens through the view (no white flash, the viewer becomes the content
  // page). A link out of the box opens nothing: the students cannot follow it.
  function onLink(ev) {
    if (ev.defaultPrevented || ev.button !== 0 || ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.altKey) { return; }
    var a = ev.target && ev.target.closest ? ev.target.closest('a[href]') : null;
    if (!a || a.hasAttribute('download')) { return; }
    var url;
    try { url = new URL(a.href); } catch (e) { return; }
    if (url.protocol === 'javascript:') { return; }
    var here = view.win().location;
    if (url.origin === location.origin && url.pathname === here.pathname && url.search === here.search) { return; }   // a place in this page
    ev.preventDefault();
    if (url.origin !== location.origin) {
      note(t('linkOut'));
      return;
    }
    open(contentOf(url) || url.pathname + url.search + url.hash);
  }

  function onReady(win) {
    publishable = false;   // until the checks below pass for this page
    setToolsOn(false);
    var content = contentOf(win.location);
    if (content) { open(content); return; }   // a viewer page that a link did not change
    win.addEventListener('scroll', onScroll, { passive: true });
    // A late image or the class font can move the block at the top edge: send the place again,
    // and draw the marks again.
    School.onLayout(win, function () { onScroll(); paintMarks(); });
    win.document.addEventListener('pointerdown', onPointerDown, true);
    win.document.addEventListener('pointermove', onPointerMove, true);

    endDrag();                // a drag on the old page does not go to this one
    pendingMark = null;
    setTool(null);
    paintMarks();
    var path = view.path();
    if (trail[trail.length - 1] !== path) { trail.push(path); }
    if (trail.length > 50) { trail.shift(); }
    backBtn.disabled = trail.length < 2;
    var mine = ++pageGen;
    if (isLibrary(win.location.pathname)) {
      note(t('openBook'), true);
      return;
    }

      .concat(drag && drag.mark ? [drag.mark] : [], pendingMark ? [pendingMark.mark] : []);

      var p = SchoolMarks.draw(win, shown);

      byTimer = false;

      return;
    }
    started = true;
    var path = School.params.get('path');

    if (trail.length < 2) { return; }

  document.getElementById('endNo').onclick = function () { confirmEl.hidden = true; };
  document.getElementById('endYes').onclick = function () {

      var max = win.document.documentElement.scrollHeight - win.innerHeight;

    }, 16);
  };

  // Lag test: 20 jumps, 600 ms apart, to random places in the page.

    var n = 0;
    var t = setInterval(function () {
      var win = view.win();
      var max = win.document.documentElement.scrollHeight - win.innerHeight;

    return s[Math.min(s.length - 1, Math.floor(p * s.length))];
  }

  function showStats() {
    var lines = ['round trip ms (one way is about half): seat n p50 p95 max'];
    Object.keys(lagRun.rtts).forEach(function (seat) {
      var r = lagRun.rtts[seat];
      lines.push(seat + ' ' + r.length + ' ' + pct(r, 0.5) + ' ' + pct(r, 0.95) + ' ' + Math.max.apply(null, r));
    });

  function seatData(seat) {
    return seen[seat] || (seen[seat] = { rtts: [], match: true, waiting: null });
  }

  function statusOf(s, now) {
    var st = seen[s.seat];
    if (!s.online || s.quiet) { return 'bad'; }

      if (st.waiting !== null && now - st.waiting > BEHIND_MS) { return 'bad'; }

  function setText(el, text) { if (el.textContent !== text) { el.textContent = text; } }

  // The seats of a group as a list in the language of the page: its own commas and "and" (review
  // T2). An old WebView with no Intl.ListFormat (Chrome 71 and older) gets commas.
  var listFormat = null;
  try { listFormat = new Intl.ListFormat(SchoolText.lang(), { type: 'conjunction' }); } catch (e) { listFormat = null; }
  function seatList(labels) {
    if (!labels.length) { return '-'; }
    return listFormat ? listFormat.format(labels) : labels.join(', ');
  }

  function render() {
    metrics.renders += 1;
    var now = performance.now();
    var groups = { ok: [], slow: [], bad: [], done: [], notDone: [] };
    roster.forEach(function (s) {
      var label = seatLabel(s.seat);
      groups[statusOf(s, now)].push(label);
      groups[s.done ? 'done' : 'notDone'].push(label);
    });
    ['ok', 'slow', 'bad'].forEach(function (g) { setText(statusBtns[g].querySelector('b'), String(groups[g].length)); });
    setText(statusBtns.done.querySelector('b'), t('doneOf', groups.done.length, roster.length));
    Object.keys(statusBtns).forEach(function (g) { statusBtns[g].setAttribute('aria-pressed', String(group === g)); });
    // A tap on Done shows the seats that are not done: the teacher waits for these.
    var list = group === 'done' ? groups.notDone : group ? groups[group] : null;
    seatsEl.hidden = !list;
    if (list) { setText(seatsEl, t(GROUP_SEATS[group], seatList(list))); }
    if (DEBUG) { renderDebug(now); }
  }

  // ?debug=1: each seat with its round trip, as the test tools need it.
  function renderDebug(now) {
    studentsEl.innerHTML = '';
    roster.forEach(function (s) {
      var st = seen[s.seat];
      var el = document.createElement('span');
      var last = st && st.rtts.length ? st.rtts[st.rtts.length - 1] + 'ms' : '-';
      el.textContent = seatLabel(s.seat) + ' ' + last + ' ' + statusOf(s, now) + (s.done ? ' Done' : '') +
        (st && st.match === false ? ' (other page)' : '');
      el.className = (s.done ? 'done' : '') + (s.online ? '' : ' off');
      studentsEl.appendChild(el);
    });
  }

  var renderTimer = null;
  var lastRender = 0;
  function scheduleRender() {
    if (renderTimer) { return; }
    renderTimer = setTimeout(function () {
      renderTimer = null;
      lastRender = performance.now();
      render();
    }, Math.max(0, RENDER_MS - (performance.now() - lastRender)));
  }
  setInterval(scheduleRender, 1000);   // "behind" changes with time

  // A dash-node restart answers 502 for a moment, which closes an EventSource for good; and the
  // box forgets the lesson. So: reopen the channel when it closes or goes quiet, and send the
  // lesson again on each open. role=page: this channel keeps the class open (router.ts).
  var live = null;
  var shownCode = null;     // the class code that this page showed last (the box owns the code)
  function connect() {
    if (live) { live.close(); }
    alive.seen();
    live = new EventSource('live?role=page&lang=' + encodeURIComponent(SchoolText.lang()));
    live.onopen = function () {
      setConn('');
      if (view.path() !== null) { publish(); }   // a page is loaded
    };
    live.onmessage = onEvent;
    live.addEventListener('ping', function () { alive.seen(); });
  }
  function reconnect() { if (ended) { return; } setConn(t('reconnecting')); connect(); }
  var alive = School.keepAlive({ live: function () { return live; }, reopen: reconnect, onClosed: reconnect });

  function onEvent(ev) {
    var m;
    metrics.events += 1;
    alive.seen();
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.type === 'lesson') { start(m.lesson); return; }
    if (m.type === 'ended') { showEnded(); return; }   // another teacher page ended the class
    if (m.type === 'marks') { marks = { url: m.url, list: m.list }; pendingMark = null; paintMarks(); return; }
    // The students choose the class by this code in Class > Join. Another code on a reconnect: the
    // box forgot the class (a dash-node restart) and opened a new one, so the students must join
    // again (review M2). The box keeps no class over a restart.
    if (m.type === 'class') {
      if (m.code && shownCode && m.code !== shownCode) { note(t('classAgain'), true); }
      if (m.code) { shownCode = m.code; }
      codeEl.textContent = m.code ? t('classCode', m.code) : '';
      return;
    }
    if (m.type === 'roster') {
      roster = m.students;
      var inClass = {};
      roster.forEach(function (st) { inClass[st.seat] = true; });
      // Students that the box expired leave no trace here.
      Object.keys(seen).forEach(function (seat) { if (!inClass[seat]) { delete seen[seat]; } });
    } else if (m.type === 'ack') {
      var st = seatData(m.seat);
      st.match = m.match;
      // The student acks the last message that it has: the messages after it still wait.
      st.waiting = m.seq >= seq ? null : sentAt[m.seq + 1] !== undefined ? sentAt[m.seq + 1] : st.waiting;
      // A student that comes back (reload, Wi-Fi) applies an old message: that is no round trip.
      // A real one takes less than 1 s on the class LAN (M0: p95 330 ms).
      if (sentAt[m.seq] === undefined || performance.now() - sentAt[m.seq] > 3000) { return; }
      var ms = Math.round(performance.now() - sentAt[m.seq]);
      st.rtts.push(ms);
      if (st.rtts.length > RTT_COUNT) { st.rtts.shift(); }
      if (lagRun) {
        var label = seatLabel(m.seat);
        (lagRun.rtts[label] = lagRun.rtts[label] || []).push(ms);
      }
    }
    scheduleRender();
  }

  if (ended) { showEnded(); return; }
  connect();
  setTimeout(function () { start(null, true); }, 3000);   // no channel yet: the start page
})();
</script>
</body>
</html>
