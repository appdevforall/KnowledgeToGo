<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>K2Go School: student</title>
<link rel="stylesheet" href="view.css">
<style>
  :root { --bg: #fff; --fg: #111; --head: #C9711C; --head-fg: #fff; --page: #fff; --accent: #C9711C; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --fg: #eee; --head: #8A4A10; --accent: #F0A050; }
  }
  html, body { margin: 0; height: 100%; font: 14px/1.3 sans-serif; background: var(--bg); color: var(--fg); }
  body { display: flex; flex-direction: column; }
  header { padding: 4px 6px; background: var(--head); color: var(--head-fg); display: flex; align-items: center; gap: 8px; }
  header button { font: inherit; margin-left: auto; }
  #ended { position: absolute; inset: 0; z-index: 4; background: var(--bg); padding: 24px; font-size: 18px; }
  #ended[hidden] { display: none; }
  #seat { font-weight: bold; }
</style>
</head>
<body>
<header translate="no">
  <span id="seat"></span>
  <span id="status"></span>
  <button id="here" data-t="followHere" hidden></button>
  <button id="done"></button>
</header>
<div id="stage"><div id="ended" data-t="ended" hidden></div></div>
<script src="text.js"></script>
<script src="anchor.js"></script>
<script src="follow.js"></script>
<script src="marks.js"></script>
<script>
'use strict';
(function () {
  var stage = document.getElementById('stage');
  var statusEl = document.getElementById('status');
  var doneBtn = document.getElementById('done');
  var seatEl = document.getElementById('seat');
  var headerEl = document.querySelector('header');
  // The words come from text.js. The class identifies phones, not people: the box gives this phone
  // a seat number, and no name goes to the box (K2G-P5).
  var seat = null;
  var shown = ['connecting'];   // the status text: a text.js key and its values
  function setStatus() {
    shown = Array.prototype.slice.call(arguments);
    statusEl.textContent = SchoolText.text.apply(null, shown);
  }
  function setSeat(n) {
    seat = n;
    seatEl.textContent = SchoolText.text('seat', (n < 10 ? '0' : '') + n);
  }
  function showWords() {
    SchoolText.apply(document);
    headerEl.dir = SchoolText.dir();
    doneBtn.textContent = SchoolText.text(done ? 'undoDone' : 'done');
    statusEl.textContent = SchoolText.text.apply(null, shown);
    if (seat) { setSeat(seat); }
  }
  // The class carries the language of its teacher page (the box keeps it).
  function useClassLang(lang) { if (SchoolText.use(lang)) { showWords(); } }

  // localStorage, not sessionStorage: the token must outlive the page. The app loads the page again
  // after a theme change or after Android stopped it, and the student must stay the same student.
  // A token that the box forgot gets a 401, and the page joins again, into the same class only.
  var KEY = 'k2go-school-token';
  var CLASS_KEY = 'k2go-school-class';   // the code of the class of the token
  var token = null;
  var classCode = null;
  try { token = localStorage.getItem(KEY); classCode = localStorage.getItem(CLASS_KEY); } catch (e) { token = null; }
  // Class > Join in the app names the class in the fragment (#c=). A stored token of another class
  // (the phone missed its end) goes: this page joins the class that the student chose.
  var chosen = /(?:^#|&)c=([2-9A-HJ-NP-Z]{4})(?:&|$)/.exec(location.hash);
  if (chosen && chosen[1] !== classCode) {
    token = null;
    classCode = chosen[1];
    try { localStorage.removeItem(KEY); localStorage.setItem(CLASS_KEY, classCode); } catch (e) { /* no storage */ }
  }
  // The app moved this student to a new box address (a new origin, so no stored token): it
  // brings the token of the old address in the fragment (#t=, never sent to a server), so the
  // student stays the same student. The fragment then goes from the address and the history.
  var moved = /(?:^#|&)t=([0-9a-f]{16,64})(?:&|$)/.exec(location.hash);
  if (moved) {
    token = moved[1];
    try { localStorage.setItem(KEY, token); } catch (e) { /* no storage */ }
  }
  if (location.hash) {
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* old browser */ }
  }
  var hereBtn = document.getElementById('here');

  var last = null;          // last lesson from the teacher: { seq, url, a }
  var match = true;         // the student shows the same block as the teacher
  var done = false;
  var ackTimer = null;
  var lastAck = 0;
  var live = null;
  var joining = false;
  var replaced = false;     // another tab of this phone follows the class with the same token
  var ended = false;        // the teacher ended the class: no channel, no join, no ack
  var marks = null;         // the marks of the lesson page, as the box sent them: { url, list }
  var painted = { doc: null, list: null };   // what paintMarks() drew last
  var NO_MARKS = [];

  var view = School.view(stage, function (win) {
    // A late image or the class font changes the layout under the anchor: apply it again.
    School.onLayout(win, function () {
      if (!onPage()) { return; }
      painted.doc = null;   // the layout changed: draw the marks again
      apply();
    });
    follow();
  });

  // The class code of a page that was in a class goes with the join: the box refuses it when that
  // class ended, so the page does not go into the next class by itself.
  function join() {
    joining = true;
    var body = classCode ? { code: classCode } : {};
    return fetch('join', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) {
      if (!r.ok) { var e = new Error('join ' + r.status); e.status = r.status; throw e; }
      return r.json();
    }).then(function (j) {
      token = j.token;
      setClass(j.code);
      useClassLang(j.lang);
      setSeat(j.seat);
      try { localStorage.setItem(KEY, token); } catch (e) { /* private mode: join again on reload */ }
    }).finally(function () { joining = false; });
  }

  function setClass(code) {
    if (!code) { return; }
    classCode = code;
    try { localStorage.setItem(CLASS_KEY, classCode); } catch (e) { /* no storage */ }
  }

  // A refused join. 409: no class is open; for a page that was in a class, its class ended. Else
  // the watchdog (keepAlive, every 5 s, no channel) tries again.
  function onJoinRefused(err) {
    var status = err && err.status;
    if (status === 409 && classCode) { onEnded(); return; }
    setStatus(status === 409 ? 'waitingClass' : status === 503 ? 'full' : status === 429 ? 'busy' : 'notReachable');
  }

  // The box forgets a student after some time offline (or after a restart): join again.
  function rejoin() {
    if (joining || replaced || ended) { return; }
    // Another tab of this phone may have joined already: use its token, do not join twice.
    var stored = null;
    try { stored = localStorage.getItem(KEY); } catch (e) { stored = null; }
    if (stored && stored !== token) {
      token = stored;
      if (document.visibilityState === 'hidden') { stopHere(); } else { connect(); }   // the visible tab keeps the class
      return;
    }
    token = null;
    if (live) { live.close(); }
    setStatus('joining');
    join().then(connect, onJoinRefused);
  }

  // A 401 says the box forgot this token. An answer for an older token (the page already uses a
  // newer one) is no reason to join again: that made a second student.
  function onForgotten(sent) {
    return function (r) { if (r.status === 401 && sent === token) { rejoin(); } };
  }

  function sendAck() {
    ackTimer = null;
    if (!last || !token || replaced || ended) { return; }
    lastAck = performance.now();
    fetch('ack', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, seq: last.seq, done: done, match: match })
    }).then(onForgotten(token)).catch(function () {});
  }

  // "Still here" every 5 s: the teacher sees a student with no word for 12 s as "bad", and the box
  // closes a channel that it does not hear from (class.ts QUIET_MS and SILENT_MS).
  setInterval(function () {
    if (!token || replaced || ended) { return; }
    fetch('ack', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token })
    }).then(onForgotten(token)).catch(function () {});
  }, 5000);

  // Ack at most 5 times a second, and always the last message.
  function ack() {
    if (ackTimer) { return; }
    ackTimer = setTimeout(sendAck, Math.max(0, 200 - (performance.now() - lastAck)));
  }

  // A lesson URL that redirects (for example a book to its main page) lands on another path:
  // that is still the page of the lesson, so it does not load again (rehearsal F1: a loop).
  function onPage() {
    return !view.loading() && last && view.isAt(last.url);
  }

  function apply() {
    match = SchoolAnchor.applyAnchor(view.win(), last.a);
    setStatus(match ? 'following' : 'followingOther');
    paintMarks();
  }

  // Draws the marks of the teacher when they are for the page on the screen. A lesson message
  // comes up to 20 times a second: draw only for a new list or a new page, or after a layout change.
  function paintMarks() {
    if (!onPage()) { return; }
    var doc = view.win().document;
    var list = marks && marks.url === last.url ? marks.list : NO_MARKS;
    if (painted.doc === doc && painted.list === list) { return; }
    try {
      SchoolMarks.draw(view.win(), list);
      painted = { doc: doc, list: list };
    } catch (e) { /* the page has no layout yet: the next message or layout change tries again */ }
  }

  function follow() {
    if (!last || ended || view.loading()) { return; }
    if (!onPage()) {
      // Done means done with this page; the box clears it too.
      if (done) { done = false; doneBtn.textContent = SchoolText.text('done'); }
      setStatus('opening');
      view.open(last.url);
      return;
    }
    apply();
    requestAnimationFrame(ack);
  }

  // The teacher ended the class. The box forgot this student: the token goes too.
  function onEnded() {
    ended = true;
    if (live) { live.close(); live = null; }
    token = null;
    classCode = null;
    setCookie(null);
    try { localStorage.removeItem(KEY); localStorage.removeItem(CLASS_KEY); } catch (e) { /* no storage */ }
    setStatus('ended');
    doneBtn.hidden = true;
    hereBtn.hidden = true;
    document.getElementById('ended').hidden = false;
  }

  function stopHere() {
    replaced = true;
    if (live) { live.close(); }
    setStatus('otherTab');
    hereBtn.hidden = false;
  }

  // The live channel reads the token from a cookie: EventSource sends no header and no body, and
  // a token in the URL goes to logs and histories (review B1). Only the class routes get it.
  function setCookie(value) {
    document.cookie = 'k2go-school=' + (value || '') + '; path=/school/; SameSite=Strict' + (value ? '' : '; max-age=0');
  }

  hereBtn.onclick = function () { setStatus('connecting'); connect(); };

  doneBtn.onclick = function () {
    done = !done;
    doneBtn.textContent = SchoolText.text(done ? 'undoDone' : 'done');
    ack();
  };

  // On each open the box sends the last lesson, so after a drop the student is back in place.
  function connect() {
    if (live) { live.close(); }
    replaced = false;
    hereBtn.hidden = true;
    alive.seen();
    setCookie(token);
    live = new EventSource('live');
    live.onmessage = function (ev) {
      alive.seen();
      try { last = JSON.parse(ev.data); } catch (e) { return; }
      follow();
    };
    live.addEventListener('ping', function () { alive.seen(); });
    live.addEventListener('marks', function (ev) {
      alive.seen();
      try { marks = JSON.parse(ev.data); } catch (e) { return; }
      paintMarks();
    });
    // The seat, the class and the Done mark that the box keeps for this student (this page for Done).
    live.addEventListener('self', function (ev) {
      var me;
      try { me = JSON.parse(ev.data); } catch (e) { return; }
      done = me.done === true;
      doneBtn.textContent = SchoolText.text(done ? 'undoDone' : 'done');
      useClassLang(me.lang);
      if (me.seat) { setSeat(me.seat); }
      setClass(me.code);
      if (!last) { setStatus('waitingTeacher'); }   // the channel is open, no lesson yet
    });
    // A newer channel with this token took the place (another tab): stop, do not open again.
    live.addEventListener('replaced', stopHere);
    live.addEventListener('ended', onEnded);
    live.onerror = function () { setStatus('reconnecting'); };
  }

  var alive = School.keepAlive({
    live: function () { return live; },
    reopen: function () { if (!replaced && !ended) { setStatus('reconnecting'); connect(); } },
    // A refused channel (for example 401 after a box restart) does not retry by itself.
    onClosed: function () { if (!joining && !replaced && !ended) { rejoin(); } }
  });

  showWords();
  if (token) { connect(); } else { rejoin(); }
})();
</script>
</body>
</html>
