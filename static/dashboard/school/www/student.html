<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K2Go School: student</title>
<style>
  html, body { margin: 0; height: 100%; font: 14px/1.3 sans-serif; background: #fff; color: #111; }
  body { display: flex; flex-direction: column; }
  header { padding: 4px 6px; background: #C9711C; color: #fff; display: flex; align-items: center; gap: 8px; }
  header button { font: inherit; margin-left: auto; }
  #stage { flex: 1; overflow: hidden; position: relative; }
  #frame { border: 0; transform-origin: 0 0; position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<header>
  <span id="name"></span>
  <span id="status">Connecting...</span>
  <button id="done">Done</button>
</header>
<div id="stage"><iframe id="frame" title="Lesson"></iframe></div>
<script src="anchor.js"></script>
<script src="follow.js"></script>
<script>
'use strict';
(function () {
  var stage = document.getElementById('stage');
  var frame = document.getElementById('frame');
  var statusEl = document.getElementById('status');
  var doneBtn = document.getElementById('done');
  var name = School.params.get('n') || ('S' + Math.floor(Math.random() * 900 + 100));
  document.getElementById('name').textContent = name;

  var KEY = 'k2go-school-token';
  var token = null;
  try { token = sessionStorage.getItem(KEY); } catch (e) { token = null; }

  var last = null;          // last lesson from the teacher: { seq, url, a }
  var match = true;         // the student shows the same block as the teacher
  var loading = false;
  var done = false;
  var ackTimer = null;
  var lastAck = 0;
  var live = null;
  var joining = false;

  School.watchFit(stage, frame);

  function join() {
    joining = true;
    return fetch('join', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name })
    }).then(function (r) {
      if (!r.ok) { throw new Error('join ' + r.status); }
      return r.json();
    }).then(function (j) {
      token = j.token;
      try { sessionStorage.setItem(KEY, token); } catch (e) { /* private mode: join again on reload */ }
    }).finally(function () { joining = false; });
  }

  // The box forgets a student after some time offline (or after a restart): join again.
  function rejoin() {
    if (joining) { return; }
    token = null;
    if (live) { live.close(); }
    statusEl.textContent = 'Joining...';
    join().then(connect).catch(function () { statusEl.textContent = 'Class not reachable'; });
  }

  function sendAck() {
    ackTimer = null;
    if (!last || !token) { return; }
    lastAck = performance.now();
    fetch('ack', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, seq: last.seq, done: done, match: match })
    }).then(function (r) { if (r.status === 401) { rejoin(); } }).catch(function () {});
  }

  // "Still here" every 10 s: the box closes a channel that it does not hear from (router.ts).
  setInterval(function () {
    if (!token) { return; }
    fetch('ack', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token })
    }).then(function (r) { if (r.status === 401) { rejoin(); } }).catch(function () {});
  }, 10000);

  // Ack at most 5 times a second, and always the last message.
  function ack() {
    if (ackTimer) { return; }
    ackTimer = setTimeout(sendAck, Math.max(0, 200 - (performance.now() - lastAck)));
  }

  function onPage() {
    return !loading && last && frame.src && School.framePath(frame) === last.url;
  }

  function apply() {
    match = SchoolAnchor.applyAnchor(frame.contentWindow, last.a);
    statusEl.textContent = match ? 'Following' : 'Following (the page is not the same)';
  }

  function follow() {
    if (!last || loading) { return; }
    if (!onPage()) {
      // Done means done with this page; the box clears it too.
      if (done) { done = false; doneBtn.textContent = 'Done'; }
      loading = true;
      statusEl.textContent = 'Opening...';
      frame.src = last.url;
      return;
    }
    apply();
    requestAnimationFrame(ack);
  }

  frame.addEventListener('load', function () {
    School.normalize(frame.contentDocument);
    // A late image or the class font changes the layout under the anchor: apply it again.
    School.onLayout(frame.contentWindow, function () { if (onPage()) { apply(); } });
    loading = false;
    follow();
  });

  doneBtn.onclick = function () {
    done = !done;
    doneBtn.textContent = done ? 'Not done' : 'Done';
    ack();
  };

  // On each open the box sends the last lesson, so after a drop the student is back in place.
  function connect() {
    if (live) { live.close(); }
    alive.seen();
    live = new EventSource('live?token=' + encodeURIComponent(token));
    live.onmessage = function (ev) {
      alive.seen();
      try { last = JSON.parse(ev.data); } catch (e) { return; }
      follow();
    };
    live.addEventListener('ping', function () { alive.seen(); });
    live.onerror = function () { statusEl.textContent = 'Reconnecting...'; };
  }

  var alive = School.keepAlive({
    live: function () { return live; },
    reopen: function () { statusEl.textContent = 'Reconnecting...'; connect(); },
    // A refused channel (for example 401 after a box restart) does not retry by itself.
    onClosed: function () { if (!joining) { rejoin(); } }
  });

  if (token) { connect(); } else { rejoin(); }
})();
</script>
</body>
</html>
