<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K2Go School: student</title>
<style>
  html, body { margin: 0; height: 100%; font: 14px/1.3 sans-serif; background: #fff; color: #111; }
  body { display: flex; flex-direction: column; }
  header { padding: 4px 6px; background: #C9711C; color: #fff; display: flex; align-items: center; gap: 8px; }
  header button { font: inherit; margin-left: auto; }
  #stage { flex: 1; overflow: hidden; position: relative; }
  #frame { border: 0; transform-origin: 0 0; position: absolute; left: 0; top: 0; }
  #who { padding: 6px; background: #F3E3D3; display: flex; gap: 6px; align-items: center; }
  #who[hidden] { display: none; }
  #who input { font: inherit; flex: 1; min-width: 0; }
  #who button { font: inherit; }
</style>
</head>
<body>
<header>
  <span id="name"></span>
  <span id="status">Connecting...</span>
  <button id="here" hidden>Follow here</button>
  <button id="other">Another student</button>
  <button id="done">Done</button>
</header>
<form id="who" hidden>
  <input id="whoName" maxlength="24" placeholder="Your name" autocomplete="off">
  <button type="submit">Join</button>
  <button type="button" id="whoCancel">Cancel</button>
</form>
<div id="stage"><iframe id="frame" title="Lesson"></iframe></div>
<script src="anchor.js"></script>
<script src="follow.js"></script>
<script>
'use strict';
(function () {
  var stage = document.getElementById('stage');
  var frame = document.getElementById('frame');
  var statusEl = document.getElementById('status');
  var doneBtn = document.getElementById('done');
  var nameEl = document.getElementById('name');
  var name = School.params.get('n') || ('S' + Math.floor(Math.random() * 900 + 100));

  // localStorage, not sessionStorage: the token must outlive the page. The app loads the page again
  // after a theme change or after Android stopped it, and the student must stay the same student.
  // A token that the box forgot gets a 401, and the page joins again.
  var KEY = 'k2go-school-token';
  var token = null;
  try { token = localStorage.getItem(KEY); } catch (e) { token = null; }
  // The app moved this student to a new box address (a new origin, so no stored token): it
  // brings the token of the old address, so the student stays the same student.
  var moved = School.params.get('t');
  if (moved && /^[0-9a-f]{16,64}$/.test(moved)) {
    token = moved;
    try { localStorage.setItem(KEY, token); } catch (e) { /* no storage */ }
  }
  nameEl.textContent = name;   // the box sends the name of this token on each open ("self")
  var hereBtn = document.getElementById('here');
  var whoForm = document.getElementById('who');
  var whoName = document.getElementById('whoName');

  var last = null;          // last lesson from the teacher: { seq, url, a }
  var match = true;         // the student shows the same block as the teacher
  var loading = false;
  var done = false;
  var ackTimer = null;
  var lastAck = 0;
  var live = null;
  var joining = false;
  var replaced = false;     // another tab of this phone follows the class with the same token

  School.watchFit(stage, frame);

  function join() {
    joining = true;
    return fetch('join', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name })
    }).then(function (r) {
      if (!r.ok) { throw new Error('join ' + r.status); }
      return r.json();
    }).then(function (j) {
      token = j.token;
      name = j.name;
      nameEl.textContent = name;
      try { localStorage.setItem(KEY, token); } catch (e) { /* private mode: join again on reload */ }
    }).finally(function () { joining = false; });
  }

  // The box forgets a student after some time offline (or after a restart): join again.
  function rejoin() {
    if (joining || replaced) { return; }
    // Another tab of this phone may have joined already: use its token, do not join twice.
    var stored = null;
    try { stored = localStorage.getItem(KEY); } catch (e) { stored = null; }
    if (stored && stored !== token) {
      token = stored;
      if (document.visibilityState === 'hidden') { stopHere(); } else { connect(); }   // the visible tab keeps the class
      return;
    }
    token = null;
    if (live) { live.close(); }
    statusEl.textContent = 'Joining...';
    join().then(connect).catch(function () { statusEl.textContent = 'Class not reachable'; });
  }

  // A 401 says the box forgot this token. An answer for an older token (the page already uses a
  // newer one) is no reason to join again: that made a second student.
  function onForgotten(sent) {
    return function (r) { if (r.status === 401 && sent === token) { rejoin(); } };
  }

  function sendAck() {
    ackTimer = null;
    if (!last || !token || replaced) { return; }
    lastAck = performance.now();
    fetch('ack', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, seq: last.seq, done: done, match: match })
    }).then(onForgotten(token)).catch(function () {});
  }

  // "Still here" every 10 s: the box closes a channel that it does not hear from (router.ts).
  setInterval(function () {
    if (!token || replaced) { return; }
    fetch('ack', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token })
    }).then(onForgotten(token)).catch(function () {});
  }, 10000);

  // Ack at most 5 times a second, and always the last message.
  function ack() {
    if (ackTimer) { return; }
    ackTimer = setTimeout(sendAck, Math.max(0, 200 - (performance.now() - lastAck)));
  }

  function onPage() {
    return !loading && last && frame.src && School.framePath(frame) === last.url;
  }

  function apply() {
    match = SchoolAnchor.applyAnchor(frame.contentWindow, last.a);
    statusEl.textContent = match ? 'Following' : 'Following (the page is not the same)';
  }

  function follow() {
    if (!last || loading) { return; }
    if (!onPage()) {
      // Done means done with this page; the box clears it too.
      if (done) { done = false; doneBtn.textContent = 'Done'; }
      loading = true;
      statusEl.textContent = 'Opening...';
      frame.src = last.url;
      return;
    }
    apply();
    requestAnimationFrame(ack);
  }

  frame.addEventListener('load', function () {
    School.normalize(frame.contentDocument);
    // A late image or the class font changes the layout under the anchor: apply it again.
    School.onLayout(frame.contentWindow, function () { if (onPage()) { apply(); } });
    loading = false;
    follow();
  });

  function stopHere() {
    replaced = true;
    if (live) { live.close(); }
    statusEl.textContent = 'Open in another tab';
    hereBtn.hidden = false;
  }

  // A phone that two students share: the next student leaves the identity of the first one (its
  // entry goes offline, and the box removes it after 2 min) and joins with its own name.
  document.getElementById('other').onclick = function () {
    whoName.value = '';
    whoForm.hidden = false;
    whoName.focus();
  };
  document.getElementById('whoCancel').onclick = function () { whoForm.hidden = true; };
  whoForm.onsubmit = function (ev) {
    ev.preventDefault();
    var next = whoName.value.trim();
    if (!next) { whoName.focus(); return; }
    if (joining) { statusEl.textContent = 'Joining... try again'; return; }   // a join for the old name runs
    whoForm.hidden = true;
    if (live) { live.close(); live = null; }
    token = null;
    replaced = false;
    hereBtn.hidden = true;
    try { localStorage.removeItem(KEY); } catch (e) { /* no storage */ }
    done = false;
    doneBtn.textContent = 'Done';
    name = next;
    nameEl.textContent = name;
    rejoin();
  };

  hereBtn.onclick = function () { statusEl.textContent = 'Connecting...'; connect(); };

  doneBtn.onclick = function () {
    done = !done;
    doneBtn.textContent = done ? 'Not done' : 'Done';
    ack();
  };

  // On each open the box sends the last lesson, so after a drop the student is back in place.
  function connect() {
    if (live) { live.close(); }
    replaced = false;
    hereBtn.hidden = true;
    alive.seen();
    live = new EventSource('live?token=' + encodeURIComponent(token));
    live.onmessage = function (ev) {
      alive.seen();
      try { last = JSON.parse(ev.data); } catch (e) { return; }
      follow();
    };
    live.addEventListener('ping', function () { alive.seen(); });
    // The name and the Done mark that the box keeps for this student (this page for Done).
    live.addEventListener('self', function (ev) {
      var me;
      try { me = JSON.parse(ev.data); } catch (e) { return; }
      done = me.done === true;
      doneBtn.textContent = done ? 'Not done' : 'Done';
      if (me.name) { name = me.name; nameEl.textContent = name; }
      if (!last) { statusEl.textContent = 'Waiting for the teacher'; }   // the channel is open, no lesson yet
    });
    // A newer channel with this token took the place (another tab): stop, do not open again.
    live.addEventListener('replaced', stopHere);
    live.onerror = function () { statusEl.textContent = 'Reconnecting...'; };
  }

  var alive = School.keepAlive({
    live: function () { return live; },
    reopen: function () { if (!replaced) { statusEl.textContent = 'Reconnecting...'; connect(); } },
    // A refused channel (for example 401 after a box restart) does not retry by itself.
    onClosed: function () { if (!joining && !replaced) { rejoin(); } }
  });

  if (token) { connect(); } else { rejoin(); }
})();
</script>
</body>
</html>
