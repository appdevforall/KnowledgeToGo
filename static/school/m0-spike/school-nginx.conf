# K2Go School M0 spike: "follow the teacher" on the teacher box (:8085).
# Throwaway spike, not M1 code. Uses the nginx nchan module that the rootfs already loads
# (libnginx-mod-nchan), so no new process and no change to dash-node or /k2go-api/ (D12).
#
#   /school/                 static pages (teacher.html, student.html)
#   /school/pub/<channel>    publish one message: localhost only (the teacher uses the box phone)
#   /school/sub/<channel>    live channel (server-sent events): open to the class network
#   /school/ack              student reply (ack of a scroll, Done): open to the class network
#   /school/acks             student replies as server-sent events: localhost only
#
# Channel "class" carries the lesson. Channel "e1" is for the load test script.

location ~ ^/school/pub/(class|e1)$ {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    nchan_publisher;
    nchan_channel_id $1;
    nchan_message_buffer_length 1;
    nchan_message_timeout 2h;
}

location ~ ^/school/sub/(class|e1)$ {
    nchan_subscriber eventsource;
    nchan_channel_id $1;
    # A late student gets the last state at once: the buffer keeps 1 message, so "oldest" is
    # the last one ("newest" waits for the next message).
    nchan_subscriber_first_message oldest;
    nchan_eventsource_ping_interval 15;
}

location = /school/ack {
    limit_except POST { deny all; }
    nchan_publisher;
    nchan_channel_id ack;
    nchan_message_buffer_length 1;
    nchan_message_timeout 60s;
    client_max_body_size 1k;
}

location = /school/acks {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    nchan_subscriber eventsource;
    nchan_channel_id ack;
    nchan_eventsource_ping_interval 15;
}

# No "^~" here: it would stop the regex match of the pub and sub locations above.
location /school/ {
    alias /library/www/html/school/;
    autoindex off;
    index index.html;
    add_header Cache-Control "no-store";
}
