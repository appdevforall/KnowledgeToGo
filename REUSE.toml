# K2GO-429: machine-readable license declaration (REUSE), follow-up to K2GO-413.
# First-party code is GPL-3.0-or-later (root LICENSE, relicensed in K2GO-413).
# Declared by path glob so no per-file header change is needed. node_modules is
# gitignored and the termux submodule is a gitlink, so reuse does not scan either.
# Matching is last-wins: the broad glob first, then the specific overrides.

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 AppDevForAll"
SPDX-License-Identifier = "GPL-3.0-or-later"

