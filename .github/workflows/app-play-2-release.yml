name: "App+Play: 2. publish release"

# K2GO-564, button 2 of the release flow. Design: controller/docs/ADR-K2GO-564-play-release-candidates.md
# Run this from main after Google approved a candidate and main says versionName "vX.Y.Z" (the final
# commit: same code, only the version line changed). It sends the final AAB to the Play beta track
# (Open testing), and only when Play accepts the upload it tags the commit and runs the release build:
# GitHub Release, website APKs, R2, the OTA update.json and the F-Droid repo (K2GO-421). An rc build is never released as final
# (check-release). Google gives its verdict by email and in Play Console (the API cannot read it).

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: "Confirm: type the newest approved candidate tag (button 1 made it), for example v1.2.0-rc.3. main is released as v1.2.0."
        required: true

# One Play upload at a time: two parallel runs would race for the same versionCode.
concurrency:
  group: play-publish
  cancel-in-progress: false

env:
  PACKAGE: org.appdevforall.k2go
  # Keyless Play credentials, the same as app-play-1-candidate.yml.
  PLAY_WIF_PROVIDER: projects/540068336150/locations/global/workloadIdentityPools/github-actions/providers/knowledgetogo-repo
  PLAY_SERVICE_ACCOUNT: k2go-play-publisher@knowledge-to-go.iam.gserviceaccount.com

jobs:
  tag:
    name: Send the final AAB to Play and tag the release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: google-play
    permissions:
      contents: write   # push the release tag
      id-token: write   # keyless sign-in to Google Cloud (Workload Identity Federation)
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this from main, not $GITHUB_REF."; exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit tests (release rules)
        working-directory: tools/play-publish
        run: python -m unittest -v test_play_publish

      - name: Sign in to Google Play (keyless)
        id: auth_plan
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.PLAY_WIF_PROVIDER }}
          service_account: ${{ env.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Plan (release tag, release notes, versionCode)
        id: plan
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth_plan.outputs.access_token }}
          RC_TAG: ${{ inputs.rc_tag }}
        run: |
          set -euo pipefail
          # Refuses a malformed tag, a released version, a candidate older than the newest, and a
          # commit whose versionName is not the final version (an rc build is never released as final).
          git ls-remote --tags origin 'v*' | sed 's#.*refs/tags/##; s#\^{}$##' | sort -u > "$RUNNER_TEMP/tags.txt"
          python tools/play-publish/play_publish.py final-plan \
            --gradle controller/app/build.gradle \
            --notes controller/ci/ota-release-notes.md \
            --tags "$RUNNER_TEMP/tags.txt" \
            --rc-tag "$RC_TAG" \
            --notes-out "$RUNNER_TEMP/notes.txt" > "$RUNNER_TEMP/plan.env"
          . "$RUNNER_TEMP/plan.env"
          code=$((code_base * 10))
          python tools/play-publish/play_publish.py check-code --package "$PACKAGE" --code "$code" > /dev/null
          { cat "$RUNNER_TEMP/plan.env"; echo "code=$code"; } >> "$GITHUB_OUTPUT"
          echo "$tag, versionCode $code, commit $GITHUB_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Create google-services.json
        working-directory: controller
        env:
          GOOGLE_SERVICES_JSON_K2GO_ANALYTICS: ${{ secrets.GOOGLE_SERVICES_JSON_K2GO_ANALYTICS }}
        run: echo "$GOOGLE_SERVICES_JSON_K2GO_ANALYTICS" > app/google-services.json

      - name: Decode Keystore
        working-directory: controller
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$ENCODED_STRING" | base64 -d > keystore.jks

      - name: Build and sign the Play AAB
        working-directory: controller
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_DSN_RELEASE: ${{ secrets.SENTRY_DSN_RELEASE }}
          CODE: ${{ steps.plan.outputs.code }}
        run: |
          chmod +x gradlew
          ./gradlew bundlePlayRelease \
            -PversionSuffix="" \
            -PplayVersionCode="$CODE" \
            -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Sign in to Google Play again (fresh token after the build)
        id: auth_send
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.PLAY_WIF_PROVIDER }}
          service_account: ${{ env.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Send to the Play beta track (Open testing)
        id: send
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth_send.outputs.access_token }}
          CODE: ${{ steps.plan.outputs.code }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          aabs=$(find controller/app/build/outputs/bundle/playRelease -name '*.aab')
          if [ "$(printf '%s\n' "$aabs" | grep -c .)" != "1" ]; then
            echo "::error::Expected exactly one Play AAB, found: '$aabs'"; exit 1
          fi
          echo "aab=$aabs" >> "$GITHUB_OUTPUT"
          python tools/play-publish/play_publish.py publish \
            --package "$PACKAGE" --track beta --aab "$aabs" --code "$CODE" \
            --name "$TAG ($CODE)" --notes-file "$RUNNER_TEMP/notes.txt"

      # Tag only after Play accepted the upload, so a release tag always has its build in Play.
      - name: Create the final tag
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          RC_TAG: ${{ inputs.rc_tag }}
          CODE: ${{ steps.plan.outputs.code }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          {
            echo "## $TAG tagged on $GITHUB_SHA (approved candidate: $RC_TAG)"
            echo "- Sent to the Play beta track (Open testing), versionCode $CODE. Google answers by email and in Play Console."
            echo "- Production stays a manual step in Play Console."
          } >> "$GITHUB_STEP_SUMMARY"

      # Keep the exact AAB sent to Play (K2GO-433 archive), named after its tag. A backup copy only:
      # the tag is already pushed, so a failure here must not stop the release build.
      - name: Archive the AAB to Cloudflare R2
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.CLOUDFLARE_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET_NAME: "k2go-apk-repo"
          AAB: ${{ steps.send.outputs.aab }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          aws s3 cp "$AAB" "s3://$BUCKET_NAME/K2Go-$TAG-play-release.aab" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type "application/octet-stream"

      - name: Cleanup secrets
        if: always()
        run: rm -f controller/keystore.jks controller/app/google-services.json

  # Website, GitHub and OTA copies of the same release. Runs only after Play accepted the AAB and the tag exists.
  release:
    name: Release build (GitHub, website, OTA)
    needs: tag
    permissions:
      contents: write   # create the GitHub Release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.tag.outputs.tag }}

    defaults:
      run:
        working-directory: ./controller

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.tag.outputs.tag }}
          submodules: recursive

      # Fail before any build or upload when the tagged build is not that exact final version.
      - name: Require versionName to equal the release tag
        working-directory: ${{ github.workspace }}
        run: python3 tools/play-publish/play_publish.py check-release --gradle controller/app/build.gradle --tag "$RELEASE_TAG"

      # TODO (Future): Add a Jira step here to verify if the version exists in Jira
      # or to extract release notes directly from a Jira board.

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ADFA-4466: the google-services plugin needs google-services.json at build time;
      # inject it from the dedicated K2Go analytics secret so the build compiles.
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON_K2GO_ANALYTICS: ${{ secrets.GOOGLE_SERVICES_JSON_K2GO_ANALYTICS }}
        run: echo "$GOOGLE_SERVICES_JSON_K2GO_ANALYTICS" > app/google-services.json

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$ENCODED_STRING" | base64 -d > keystore.jks

      # --- VERSION AUDIT ---

      - name: Log Pinned Binary Version
        run: |
          echo "=========================================="
          echo "Compiling with native binaries pinned to:"
          cat binary_version.txt
          echo ""
          echo "=========================================="

      # --- BUILD AND SIGNING ---

      - name: Build and Sign Release APKs
        env:
          # :app:syncNativeArtifacts queries the GitHub API for the pinned binaries
          # release; unauthenticated it gets HTTP 403 (shared-runner rate limit), so
          # provide the auto token for the M15 authenticated-retry fallback (build.gradle).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # ADFA-4533: GlitchTip DSN for release builds
          SENTRY_DSN_RELEASE: ${{ secrets.SENTRY_DSN_RELEASE }}
        run: |
          # Release tags ship a clean version (v1.0.0), no commit hash. build.gradle only
          # falls back to the git SHA suffix when versionSuffix is absent; pass it empty here.
          # In-APK traceability is unaffected: BuildConfig.GIT_SHA still records the commit.
          # K2GO-431: build both flavors. standard -> GitHub + R2 + OTA update.json (as before);
          # fdroid -> R2 only (F-Droid distributes it; it carries no in-app OTA).
          # K2GO-564: the Play AAB is built and archived by app-play-1-candidate.yml; Google approves that
          # exact build, so the release does not build a second one.
          ./gradlew assembleStandardRelease assembleFdroidRelease \
            -PversionSuffix="" \
            -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      # --- GITHUB RELEASES ---

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Marks a "-beta" tag as a pre-release. rc tags never reach this workflow (K2GO-564).
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-beta') }}
          files: controller/**/build/outputs/apk/standard/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- CLOUDFLARE R2 UPLOAD ---

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.CLOUDFLARE_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET_NAME: "k2go-apk-repo"
        run: |
          # K2GO-431: upload BOTH flavors (standard + fdroid) to R2. The flavor dir sits between
          # apk/ and release/ (apk/standard/release, apk/fdroid/release); the old apk/release path
          # never matched a flavored build.
          for apk in $(find . -path "*/build/outputs/apk/*/release/*.apk"); do
            filename=$(basename "$apk")
            echo "Uploading $filename to Cloudflare R2 ($BUCKET_NAME)..."
            
            # Use aws-cli configured to point to Cloudflare's S3-compatible API
            aws s3 cp "$apk" "s3://$BUCKET_NAME/$filename" \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              --content-type "application/vnd.android.package-archive"
          done

      # --- OTA MANIFEST (update.json) ---
      # ADFA-4984: publish the OTA manifest LAST, after the APKs are already in R2, so it never
      # points at a missing binary. update.json is a fixed key -> it overwrites the previous manifest
      # and always resolves to the latest release (no .1/.2 copies). The changelog is copied verbatim
      # from the top entry of controller/ci/ota-release-notes.md, which must match the release tag.
      - name: Generate and upload update.json
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.CLOUDFLARE_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET_NAME: "k2go-apk-repo"
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          echo "Release tag: $TAG"

          # versionCodeBase = the app module's raw versionCode (the app divides the installed
          # code, base x 10, by 10 to compare). First versionCode in controller/app/build.gradle.
          VCODE=$(grep -oE 'versionCode[[:space:]]+[0-9]+' controller/app/build.gradle | head -1 | grep -oE '[0-9]+')
          echo "versionCodeBase: $VCODE"

          # Top entry of controller/ci/ota-release-notes.md; its header must equal the tag (guard against stale notes).
          HEADER=$(grep -m1 '^## ' controller/ci/ota-release-notes.md | sed 's/^##[[:space:]]*//')
          if [ "$HEADER" != "$TAG" ]; then
            echo "::error::controller/ci/ota-release-notes.md top entry '$HEADER' does not match tag '$TAG'. Update the notes before tagging."
            exit 1
          fi
          # Body = the lines between the first '## ' header and the next one (blank lines trimmed).
          CHANGELOG=$(awk '/^## /{n++; next} n==1{print}' controller/ci/ota-release-notes.md | sed '/^[[:space:]]*$/d')
          echo "Changelog:"; printf '%s\n' "$CHANGELOG"

          # The one standard APK just uploaded to R2 (K2GO-565: no ABI splits).
          # OTA update.json covers the standard flavor only (fdroid ships with OTA disabled).
          APK=$(find controller -path "*/build/outputs/apk/standard/release/*.apk" -printf '%f\n')
          echo "apk=$APK"
          if [ -z "$APK" ] || [ "$(printf '%s\n' "$APK" | wc -l)" -ne 1 ]; then
            echo "::error::Expected exactly one standard APK, found: '$APK'. Aborting instead of publishing a wrong manifest."
            exit 1
          fi

          # jq escapes the multiline changelog safely into a JSON string. Installs up to v1.1 pick
          # apk_arm64_v8a / apk_armeabi_v7a by ABI, so those keys also name the one APK. Remove
          # those two keys when no v1.1 install remains (v1.2+ reads apk_universal only).
          jq -n \
            --argjson vcode "$VCODE" \
            --arg vname "$TAG" \
            --arg changelog "$CHANGELOG" \
            --arg apk "$APK" \
            '{versionCodeBase: $vcode, versionName: $vname, changelog: $changelog,
              apk_universal: $apk, apk_arm64_v8a: $apk, apk_armeabi_v7a: $apk}' \
            > update.json
          echo "----- update.json -----"; cat update.json

          # Upload LAST (after the APKs). Fixed key -> overwrites the previous manifest.
          aws s3 cp update.json "s3://$BUCKET_NAME/update.json" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type "application/json"

      # TODO (Future): Add Jira finalization step here to automatically mark
      # the Jira version as "Released" and close the corresponding tickets.

      # TODO (Future): Add a Slack notification step to announce the official release
      # with links to the GitHub Release page and direct Cloudflare downloads.

      # --- SECURITY CLEANUP ---

      - name: Cleanup Keystore
        if: always()
        run: rm -f keystore.jks

  # K2GO-421: the self-hosted F-Droid repository, from the fdroid APK that the release job put on R2.
  fdroid-repo:
    name: F-Droid repository
    needs: [tag, release]
    permissions:
      contents: read
    uses: ./.github/workflows/app-fdroid-repo.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      staging: false
    secrets: inherit
