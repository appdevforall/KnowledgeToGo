name: Republish APK + AAB to R2 (interim manual)

# INTERIM / TEMPORARY tool (K2GO-457). It pushes the website APK (standard flavor) and the Play AAB
# (play flavor) to Cloudflare R2 BETWEEN tagged releases, while versionName stays on 1.1.0 and only
# versionCode moves. It OVERWRITES the live R2 objects the website serves (same filenames).
#
# What it does NOT do, on purpose:
#   - No git tag, no GitHub Release (GitHub stays behind; R2 is the live copy).
#   - It does NOT touch update.json, so the in-app OTA does NOT re-prompt existing standard installs.
#     The new build reaches NEW website downloads and the Play channel only.
#
# PRECONDITION: bump versionCode in controller/app/build.gradle and merge to main FIRST, then run this
# from main. Play rejects a duplicate versionCode, and a same-code republish is not seen as an update.
#
# The tagged-release path stays in android-release-build.yml, untouched. TO RETIRE once monthly tagged
# releases are stable: delete this file.

on:
  workflow_dispatch:

jobs:
  build-and-republish:
    name: Build standard APK + play AAB, push to R2
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./controller

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # standard and play both carry Firebase, so the google-services plugin needs this file at build time.
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON_K2GO_ANALYTICS: ${{ secrets.GOOGLE_SERVICES_JSON_K2GO_ANALYTICS }}
        run: echo "$GOOGLE_SERVICES_JSON_K2GO_ANALYTICS" > app/google-services.json

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$ENCODED_STRING" | base64 -d > keystore.jks

      - name: Log Pinned Binary Version
        run: |
          echo "Compiling with native binaries pinned to:"
          cat binary_version.txt

      # One gradlew run builds both outputs, so the APK and the AAB carry the SAME versionCode (in sync by
      # construction). versionSuffix="" keeps clean "K2Go-v1.1.0-..." names that overwrite the live keys.
      - name: Build and sign standard APK + play AAB
        env:
          # syncNativeArtifacts queries the GitHub API for the pinned binaries; the token avoids the
          # unauthenticated 403 rate limit (same as android-release-build.yml).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_DSN_RELEASE: ${{ secrets.SENTRY_DSN_RELEASE }}
        run: |
          ./gradlew assembleStandardRelease bundlePlayRelease \
            -PversionSuffix="" \
            -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Upload APK + AAB to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.CLOUDFLARE_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET_NAME: "k2go-apk-repo"
        run: |
          set -euo pipefail
          # This step OVERWRITES the live R2 objects. Fail loud if the build produced nothing, instead of
          # a green "published" run that uploaded no file.
          apks=$(find . -path "*/build/outputs/apk/standard/release/*.apk")
          aabs=$(find . -path "*/build/outputs/bundle/playRelease/*.aab")
          if [ -z "$apks" ] || [ -z "$aabs" ]; then
            echo "::error::Expected standard APK(s) and a play AAB, but found apks='$apks' aab='$aabs'. Aborting before touching R2."
            exit 1
          fi

          # Standard-flavor APKs: what the website serves. Overwrite the live keys by filename.
          for apk in $apks; do
            filename=$(basename "$apk")
            echo "Uploading $filename to R2 ($BUCKET_NAME)..."
            aws s3 cp "$apk" "s3://$BUCKET_NAME/$filename" \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              --content-type "application/vnd.android.package-archive"
          done
          # Play AAB (play flavor): source for the manual Play Console upload (Play upload stays manual).
          for aab in $aabs; do
            filename=$(basename "$aab")
            echo "Uploading $filename to R2 ($BUCKET_NAME)..."
            aws s3 cp "$aab" "s3://$BUCKET_NAME/$filename" \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              --content-type "application/octet-stream"
          done

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f keystore.jks
          rm -f app/google-services.json
