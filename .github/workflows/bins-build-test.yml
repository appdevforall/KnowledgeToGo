name: "Bins: build + test (called)"

# The build and the tests of the static native binaries. It publishes nothing.
# Callers: bins-1-build.yml (the pinned sources, then a release) and test-bins-canary.yml (the
# newest upstream sources, no release). The artifact termux-ninja-binaries is the tested bundle.

on:
  workflow_call:
    inputs:
      layout:
        description: "parallel = one runner per ABI. serial = both ABIs on one runner."
        type: string
        default: parallel
      upstream:
        description: "pinned = the sources in tools/proot-builder/termux-pins.env. newest = termux-packages master HEAD and the newest builder image."
        type: string
        default: pinned
      retention-days:
        description: "Days to keep the artifacts. 0 = the repository default."
        type: number
        default: 0

permissions:
  contents: read

jobs:
  # One job chooses the sources, so that all ABIs build from the same commit and image.
  # The job summary shows them: in the canary history, it is the commit that broke the build.
  sources:
    name: Sources (${{ inputs.upstream }})
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.pick.outputs.commit }}
      image: ${{ steps.pick.outputs.image }}
    steps:
    - name: Checkout project code
      uses: actions/checkout@v5

    - name: Choose the termux-packages commit and the builder image
      id: pick
      env:
        UPSTREAM: ${{ inputs.upstream }}
      run: |
        case "$UPSTREAM" in
          pinned)
            . tools/proot-builder/termux-pins.env
            commit="$TERMUX_PACKAGES_COMMIT"
            image="$TERMUX_BUILDER_IMAGE" ;;
          newest)
            # The image of run-docker.sh is ghcr.io/termux/package-builder, tag latest.
            commit="$(git ls-remote https://github.com/termux/termux-packages.git refs/heads/master | cut -f1)"
            digest="$(docker buildx imagetools inspect ghcr.io/termux/package-builder:latest | awk '/^Digest:/ {print $2; exit}')"
            image="ghcr.io/termux/package-builder@$digest" ;;
          *)
            echo "::error::upstream must be pinned or newest, not '$UPSTREAM'"; exit 1 ;;
        esac
        [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no termux-packages commit ('$commit')"; exit 1; }
        [[ "$image" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "::error::no builder image digest ('$image')"; exit 1; }
        echo "commit=$commit" >> "$GITHUB_OUTPUT"
        echo "image=$image" >> "$GITHUB_OUTPUT"
        {
          echo "### Sources ($UPSTREAM)"
          echo "- termux-packages: [\`$commit\`](https://github.com/termux/termux-packages/commit/$commit)"
          echo "- builder image: \`$image\`"
        } >> "$GITHUB_STEP_SUMMARY"

  # K2GO-548: parallel (default) = one runner per ABI.
  # serial = one runner builds both ABIs ("--arch all"). Either way the assemble job joins the
  # jniLibs trees into the same bundle. In parallel, one ABI failing cancels the other.
  build-binaries:
    name: Compile static termux packages (${{ matrix.abi }})
    needs: sources
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        abi: ${{ fromJSON(inputs.layout == 'serial' && '["all"]' || '["arm64-v8a", "armeabi-v7a"]') }}

    steps:
    - name: Checkout project code
      uses: actions/checkout@v5

    - name: Use the sources of the sources job
      if: inputs.upstream == 'newest'
      env:
        COMMIT: ${{ needs.sources.outputs.commit }}
        IMAGE: ${{ needs.sources.outputs.image }}
      run: |
        {
          echo "TERMUX_PACKAGES_COMMIT=$COMMIT"
          echo "TERMUX_BUILDER_IMAGE=$IMAGE"
        } > tools/proot-builder/termux-pins.env

    - name: Grant execute permission to builder script
      run: chmod +x tools/proot-builder/build_static.sh

    - name: Run Compilation (this will take awhile)
      run: |
        ./tools/proot-builder/build_static.sh --rebuild-all --arch ${{ matrix.abi }} \
          --build-dir ${{ github.workspace }}/termux-build \
          --out-dir ${{ github.workspace }}/termux-artifacts

    - name: Save this ABI's binaries
      uses: actions/upload-artifact@v6
      with:
        name: termux-binaries-${{ matrix.abi }}
        path: ${{ github.workspace }}/termux-artifacts/jniLibs/
        retention-days: ${{ inputs.retention-days }}

  assemble:
    name: Assemble the bundle (manifest + CA)
    needs: [sources, build-binaries]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout project code
      uses: actions/checkout@v5

    - name: Use the sources of the sources job
      if: inputs.upstream == 'newest'
      env:
        COMMIT: ${{ needs.sources.outputs.commit }}
        IMAGE: ${{ needs.sources.outputs.image }}
      run: |
        {
          echo "TERMUX_PACKAGES_COMMIT=$COMMIT"
          echo "TERMUX_BUILDER_IMAGE=$IMAGE"
        } > tools/proot-builder/termux-pins.env

    - name: Download every ABI into one jniLibs tree
      uses: actions/download-artifact@v7
      with:
        pattern: termux-binaries-*
        merge-multiple: true
        path: ${{ github.workspace }}/termux-artifacts/jniLibs

    - name: Write ninja_manifest.json and cacert.pem
      run: bash tools/proot-builder/make-manifest.sh "${{ github.workspace }}/termux-artifacts"

    - name: Save artifacts to GitHub panel
      uses: actions/upload-artifact@v6
      with:
        name: termux-ninja-binaries
        path: ${{ github.workspace }}/termux-artifacts/
        retention-days: ${{ inputs.retention-days }}

  # Gate: run the binary contract/smoke tests on the freshly built bundle.
  # arm64-v8a runs natively on the ARM runner (faithful proot launch); the
  # 32-bit arch is emulated via QEMU (proot is version-only there). A failure
  # here blocks the publish job of bins-1-build.yml, so a broken rebuild is never released.
  smoke-test:
    name: Smoke/contract test (ADFA-4465)
    needs: assemble
    runs-on: ubuntu-24.04-arm
    steps:
    - name: Checkout project code
      uses: actions/checkout@v5

    - name: Download freshly built binaries
      uses: actions/download-artifact@v7
      with:
        name: termux-ninja-binaries
        path: ${{ github.workspace }}/artifacts

    - name: Tools for the proot launch + emulation fallback
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y binutils qemu-user-static binfmt-support busybox-static
        chmod +x tools/proot-builder/smoke-native-binaries.sh

    - name: Register binfmt (QEMU) for foreign-arch binaries
      uses: docker/setup-qemu-action@v4

    - name: Contract test - arm64-v8a (native)
      run: ./tools/proot-builder/smoke-native-binaries.sh --jnilibs "${{ github.workspace }}/artifacts" --arch arm64-v8a

    - name: Contract test - armeabi-v7a (emulated)
      run: ./tools/proot-builder/smoke-native-binaries.sh --jnilibs "${{ github.workspace }}/artifacts" --arch armeabi-v7a

  # K2GO-595: gate on real kernels. The runners have a new kernel, and proot only fakes uname, so a
  # fault for old phones (the NDK r30 arc4random, K2GO-594) passed the smoke test. This job boots
  # pinned kernels from 3.16 to 6.12 in QEMU and runs the bundle and each build customization on
  # both ABIs. A failure blocks the publish job of bins-1-build.yml.
  kernel-matrix:
    name: Native binaries on real kernels (K2GO-595)
    needs: assemble
    runs-on: ubuntu-latest
    steps:
    - name: Checkout project code
      uses: actions/checkout@v5

    - name: Download freshly built binaries
      uses: actions/download-artifact@v7
      with:
        name: termux-ninja-binaries
        path: ${{ github.workspace }}/artifacts

    - name: Tools (QEMU, static cross compilers for the probes)
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y qemu-system-arm cpio gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf libc6-dev-arm64-cross libc6-dev-armhf-cross

    - name: Cache the pinned kernels
      uses: actions/cache@v4
      with:
        path: ~/.cache/k2go-kernel-matrix
        key: kernel-matrix-${{ hashFiles('tools/proot-builder/kernel-matrix/kernels.lock') }}

    - name: Run the kernel matrix
      run: bash tools/proot-builder/kernel-matrix/run-kernel-matrix.sh --jnilibs "${{ github.workspace }}/artifacts"
