name: Bake & publish K2Go RootFS

# ADFA-5334. Builds the rootfs images with tools/rootfs-builder/build-iiab-rootfs.sh
# (native proot on arm64 runners) and publishes them to Cloudflare R2 (k2go-rootfs).
# Supersedes the old QEMU/Docker bake-rootfs.yml.disabled.
#
# Split by architecture into two parallel jobs (one arm64 node each), each building
# ALL tiers (basic, standard, full, matomo). ~1.5h per node. The APK is NOT touched
# here; ADFA-5368 re-pointed the app at this bucket (config/DownloadEndpoints).
#
# A one-shot `seed-base` job runs first: it puts the STATIC proot-distro base (the two
# Debian tarballs K2Go builds on) into R2 exactly once, then only verifies its presence
# on every later run. Retention: the prune keeps the newest 7 batches per (tier,arch).
#
# K2GO-511: three modes. test builds only (uploads nothing, keeps no artifacts), so it is safe
# for trying an IIAB change. dev stages the build as dev_latest_* pointers for on-device testing
# and touches NEITHER the stable latest_* NOR the shared catalog inputs (build-*.log,
# PUBLISH_QUEUE*.tsv). publish moves the stable latest_* pointers (what a production install
# downloads). The seed-base job runs in every mode: the builder downloads the base from R2, and
# seed-base only mirrors the pinned upstream base when it is missing.

run-name: Bake rootfs (${{ inputs.mode }}, ${{ inputs.mode != 'publish' && format('{0} {1}', inputs.tier, inputs.arch) || 'all tiers, both arches' }}, ${{ inputs.layout }})

on:
  workflow_dispatch:   # manual only for now
    inputs:
      mode:
        description: "test = build only, nothing uploaded. dev = upload as dev_latest_* staging pointers (stable latest_* untouched). publish = upload and move the stable latest_* pointers (production)."
        type: choice
        options: [test, dev, publish]
        default: test
      tier:
        description: "Tier to build (test and dev modes only; publish always builds all)."
        type: choice
        options: [all, basic, standard, full, matomo]
        default: all
      arch:
        description: "Architecture to build (test and dev modes only; publish always builds both)."
        type: choice
        options: [all, arm64-v8a, armeabi-v7a]
        default: all
      binaries_tag:
        description: "Native-binaries release tag to pin (blank = binary_version.txt on main). e.g. binaries-2026-09-01_03-22 to bake on a specific proot build without merging."
        required: false
        default: ""
      layout:
        description: "Nodes. dual = 2 nodes (one per arch, tiers in series). serial = one node per tier and arch, 4 at a time. parallel = one node per tier and arch, all 8 at once."
        type: choice
        options: [dual, serial, parallel]
        default: dual
      fail_fast:
        description: "Cancel every node as soon as one fails (nothing publishes anyway)."
        type: boolean
        default: true
      run_prebuild_tests:
        description: "Run the pre-build tests first and gate the bake on them. Leave on unless you must bypass."
        type: boolean
        default: true
      go_version:
        description: "Go toolchain for mkmetalink (pinned; blank = latest from go.dev)."
        default: "go1.27.3"
      mkmetalink_version:
        description: "mkmetalink module version (pinned; 'latest' to track upstream)."
        default: "v0.1.0"
  # Re-enable when we want it scheduled:
  # schedule:
  #   - cron: '0 4 * * 0'   # Sundays 04:00 UTC

env:
  BUCKET_NAME: k2go-rootfs
  R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  # Public base that goes into the .meta4 <url>: where the APK actually downloads the
  # rootfs FROM, so it has to name the bucket that holds it. The two buckets are separate
  # and so are their names: k2go-download.appdevforall.org serves the APK repo only.
  # K2GO-90: this defaulted to k2go-download.appdevforall.org/rootfs, a path-based route that
  # was never created. The metalinks published with it resolved to 404, and since
  # --reset-mirrors leaves a single source, there was nothing to fall back to.
  ROOTFS_PUBLIC_BASE: ${{ vars.ROOTFS_PUBLIC_BASE || 'https://pub-d64c885cef6c42db8c7925144d73d0ee.r2.dev' }}
  # Key prefix inside the bucket. Empty: the keys sit at the bucket root (only the static
  # proot-distro base lives in a folder). Set it only if the layout gains a prefix.
  R2_KEY_PREFIX: ${{ vars.ROOTFS_KEY_PREFIX }}

# One bake at a time: two overlapping runs would race on the same pointers. A relaunch queues.
concurrency:
  group: bake-rootfs
  cancel-in-progress: false

jobs:
  # K2GO-567: fast native tests gate the bake. The test logic lives in its own workflow (editable
  # without touching this one, which stays pure construction); the bake runs only if it passes.
  prebuild-tests:
    if: ${{ inputs.run_prebuild_tests }}
    uses: ./.github/workflows/prebuild-tests.yml

  # The Debian base every tier is built on is a proot-distro v4.29.0 release asset
  # (github.com/termux/proot-distro), fetched from the upstream release. It is STATIC, so seed it
  # into R2 ONCE; every later run only HEADs it (no re-download). Bumping PD_VERSION seeds a
  # fresh proot-distro-v<ver>/ dir once. Only the two bases K2Go consumes are mirrored
  # (Android arm64-v8a -> aarch64, armeabi-v7a -> arm); the rest of the release is not.
  seed-base:
    name: Seed proot-distro base (once) + verify
    runs-on: ubuntu-latest        # pure download+upload; no arm needed, frees the arm runners
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ensure AWS CLI is available
        run: aws --version || { sudo apt-get update && sudo apt-get install -y awscli; }

      - name: Seed-or-verify the static proot-distro base on R2
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.CLOUDFLARE_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # Single source of truth: read the version the builder actually downloads,
          # so a PD_VERSION bump in build-iiab-rootfs.sh seeds the new base automatically.
          BUILDER="tools/rootfs-builder/build-iiab-rootfs.sh"
          PD_VERSION="$(grep -oP '^PD_VERSION="?\K[0-9.]+' "$BUILDER" | head -1)"
          [ -n "$PD_VERSION" ] || { echo "FATAL: could not read PD_VERSION from $BUILDER" >&2; exit 1; }
          echo "proot-distro base version (from builder): v${PD_VERSION}"
          GH_BASE="https://github.com/termux/proot-distro/releases/download/v${PD_VERSION}"
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          PFX="${R2_KEY_PREFIX:-}"                  # '' or 'rootfs/', same as the bake job
          DIR="proot-distro-v${PD_VERSION}"
          # Only the bases K2Go builds on. Names match build-iiab-rootfs.sh BASE_TARBALL.
          TARBALLS=( "debian-trixie-aarch64-pd-v${PD_VERSION}.tar.xz" \
                     "debian-trixie-arm-pd-v${PD_VERSION}.tar.xz" )

          for tb in "${TARBALLS[@]}"; do
            key="${PFX}${DIR}/${tb}"
            # Present on R2 -> verify-only: a HEAD, never a re-download (the base is static).
            if aws s3api head-object --bucket "$BUCKET_NAME" --key "$key" \
                 --endpoint-url "$ENDPOINT" >/dev/null 2>&1; then
              echo ">> present (verify-only, no download): $key"
              continue
            fi
            # Missing -> seed once from the pinned release, with a sha256 record beside it.
            echo ">> missing -> seed once from the pinned release: $tb"
            curl -fL --retry 3 --retry-delay 5 -o "$tb" "${GH_BASE}/${tb}"
            sha256sum "$tb" > "${tb}.sha256"
            aws s3 cp "$tb"          "s3://${BUCKET_NAME}/${key}"        --endpoint-url "$ENDPOINT"
            aws s3 cp "${tb}.sha256" "s3://${BUCKET_NAME}/${key}.sha256" --endpoint-url "$ENDPOINT"
            rm -f "$tb" "${tb}.sha256"
          done
          echo "Base seed/verify complete for proot-distro-v${PD_VERSION}."


  # K2GO-511: the node layout. dual = one node per arch, all tiers in series (the old shape).
  # serial = one node per (tier, arch), 4 at a time. parallel = one node per (tier, arch), all 8
  # at once. The concurrent-job cap is per organization and shared with every workflow; jobs over
  # the cap queue, they do not fail.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      max_parallel: ${{ steps.p.outputs.max_parallel }}
    steps:
      - id: p
        run: |
          set -euo pipefail
          MODE="${{ inputs.mode }}"; TIER="${{ inputs.tier }}"; ARCH="${{ inputs.arch }}"
          LAYOUT="${{ inputs.layout }}"
          # publish always builds every tier for both arches
          [ "$MODE" = publish ] && { TIER=all; ARCH=all; }
          if [ "$ARCH" = all ]; then arches="arm64-v8a armeabi-v7a"; else arches="$ARCH"; fi
          if [ "$TIER" = all ]; then tiers="basic standard full matomo"; else tiers="$TIER"; fi
          if [ "$LAYOUT" = dual ]; then
            maxp=2
            m=$(for a in $arches; do jq -cn --arg a "$a" --arg t "$TIER" '{arch:$a,tier:$t}'; done | jq -cs .)
          else
            if [ "$LAYOUT" = serial ]; then maxp=4; else maxp=8; fi
            m=$(for a in $arches; do for t in $tiers; do jq -cn --arg a "$a" --arg t "$t" '{arch:$a,tier:$t}'; done; done | jq -cs .)
          fi
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "max_parallel=$maxp" >> "$GITHUB_OUTPUT"
          echo "layout=$LAYOUT max_parallel=$maxp matrix=$m"

  bake:
    needs: [prebuild-tests, seed-base, plan]    # K2GO-567: tests gate the bake; base present before publish
    # always() so a SKIPPED prebuild-tests (run_prebuild_tests=false) does not auto-skip the bake; the
    # bake still runs only if prebuild-tests did not FAIL/cancel and the base + plan succeeded.
    if: ${{ always() && needs.prebuild-tests.result != 'failure' && needs.prebuild-tests.result != 'cancelled' && needs.seed-base.result == 'success' && needs.plan.result == 'success' }}
    name: RootFS ${{ matrix.arch }} ${{ matrix.tier }}
    # Native arm64 runner (the builder uses native proot, not QEMU). Adjust the label
    # if the org uses a different arm64 runner (e.g. a self-hosted one).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330   # under the 6h hard cap; an all-tier node (dual) is ~1.5h
    strategy:
      # Default on: one failed node cancels the rest, since nothing publishes anyway.
      fail-fast: ${{ inputs.fail_fast }}
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ensure AWS CLI is available
        if: inputs.mode != 'test'
        run: aws --version || { sudo apt-get update && sudo apt-get install -y awscli; }

      - name: Build ${{ matrix.tier }} for ${{ matrix.arch }}
        run: |
          TAG_ARG=""
          [ -n "${{ inputs.binaries_tag }}" ] && TAG_ARG="--binaries-tag ${{ inputs.binaries_tag }}"
          TIER_ARG="--tier ${{ matrix.tier }}"
          [ "${{ matrix.tier }}" = all ] && TIER_ARG="--all-tier"
          # test/dev bake the dispatched branch end to end (builder, installer, clone); publish uses main.
          K2GO_REF="${{ inputs.mode == 'publish' && 'main' || github.ref_name }}"
          sudo bash ./tools/rootfs-builder/build-iiab-rootfs.sh \
            $TIER_ARG --arch "${{ matrix.arch }}" \
            $TAG_ARG --k2go-ref "$K2GO_REF" \
            --go-version "${{ inputs.go_version }}" \
            --mkmetalink-version "${{ inputs.mkmetalink_version || 'latest' }}" \
            --publish-url "$ROOTFS_PUBLIC_BASE" --reset-mirrors
          # the builder runs as root; hand dist/ back to the runner so the upload step can read it
          sudo chown -R "$(id -u):$(id -g)" dist

      - name: Summary (built files)
        if: always()
        run: |
          {
            echo "### ${{ inputs.mode }} bake, ${{ matrix.arch }} ${{ matrix.tier }}"
            case "${{ inputs.mode }}" in
              test) echo "Test mode: nothing was uploaded." ;;
              *)    echo "Data uploaded; pointers move only when every node passes (publish job)." ;;
            esac
            echo '```'
            ls -lh dist 2>/dev/null || echo "dist/ was not created"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # K2GO-554: sign each dated tarball with minisign (prehashed Ed25519) BEFORE the upload, so the
      # detached <tarball>.minisig rides the same data upload as a per-artifact sidecar (never a
      # pointer). Dormant until the repo variable ROOTFS_SIGNING_ENABLED is 'true' (BC4: the app must
      # verify signatures on every channel before signing turns on). The builder stays secret-free;
      # only this step sees the key. See controller/docs/ADR-K2GO-554-signed-rootfs-skip-listing.md.
      - name: Sign tarballs with minisign (${{ inputs.mode }})
        if: inputs.mode != 'test' && vars.ROOTFS_SIGNING_ENABLED == 'true'
        env:
          ROOTFS_MINISIGN_KEY_BASE64: ${{ secrets.ROOTFS_MINISIGN_KEY_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "${ROOTFS_MINISIGN_KEY_BASE64:-}" ] \
            || { echo "FATAL: signing is enabled but secret ROOTFS_MINISIGN_KEY_BASE64 is empty" >&2; exit 1; }
          command -v minisign >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y minisign; }
          PUB="$GITHUB_WORKSPACE/controller/rootfs-signing.pub"
          [ -f "$PUB" ] || { echo "FATAL: public key $PUB is missing" >&2; exit 1; }
          # Decode the passwordless secret key to a private temp file; shred it on exit.
          umask 077
          KEY="$(mktemp)"; trap 'shred -u "$KEY" 2>/dev/null || rm -f "$KEY"' EXIT
          printf '%s' "$ROOTFS_MINISIGN_KEY_BASE64" | base64 -d > "$KEY"
          shopt -s nullglob
          cd dist
          for tb in k2go_*.tar.gz; do
            # Bake gate (D4): refuse any absolute or '..' member before signing, so the signature
            # certifies a tarball that already passed the traversal check (lets the app skip listing).
            # Capture the listing first so a tar read error fails closed (a pipe to grep would hide
            # it under pipefail and sign an unlistable tarball).
            members="$(tar -tzf "$tb")" \
              || { echo "FATAL: cannot list $tb; refusing to sign" >&2; exit 1; }
            if printf '%s\n' "$members" | grep -Eq '^/|(^|/)\.\.(/|$)'; then
              echo "FATAL: $tb has an unsafe member (absolute or ..); refusing to sign" >&2; exit 1
            fi
            # ADR Amendment 1 (A1): the trusted comment is a manifest that the app authenticates with
            # the global signature alone, so the phone never hashes the tarball for identity. The
            # sha-256 is recomputed here: a stale .sha256 or .meta4 fails the bake instead of shipping
            # a manifest that the app rejects.
            sha="$(sha256sum "$tb" | awk '{print $1}')"
            [ "$sha" = "$(awk '{print $1}' "${tb}.sha256")" ] \
              || { echo "FATAL: ${tb}.sha256 does not match $tb" >&2; exit 1; }
            { [ -f "${tb}.meta4" ] && grep -q "$sha" "${tb}.meta4"; } \
              || { echo "FATAL: ${tb}.meta4 is missing or does not carry the sha-256 of $tb" >&2; exit 1; }
            manifest="k2go-rootfs v1 file=$tb size=$(stat -c%s "$tb") sha256=$sha meta4=$(sha256sum "${tb}.meta4" | awk '{print $1}')"
            echo ">> sign $tb: $manifest"
            minisign -S -H -s "$KEY" -m "$tb" -t "$manifest" </dev/null
            [ "$(sed -n 3p "${tb}.minisig")" = "trusted comment: $manifest" ] \
              || { echo "FATAL: ${tb}.minisig does not carry the manifest" >&2; exit 1; }
            # The app verifier accepts ONLY the prehashed form (algorithm tag "ED"); assert it here.
            tag="$(sed -n 2p "${tb}.minisig" | base64 -d 2>/dev/null | head -c2 || true)"
            [ "$tag" = "ED" ] || { echo "FATAL: ${tb}.minisig is not prehashed (tag '$tag', want ED)" >&2; exit 1; }
            # Self-verify the fresh signature with the committed public key (catches a mangled secret).
            minisign -Vm "$tb" -p "$PUB" >/dev/null \
              || { echo "FATAL: self-verify failed for $tb" >&2; exit 1; }
          done

      # K2GO-511: each node uploads only DATA (dated tarballs + their sidecars). Nothing points to
      # them yet, so a node that passes while another fails exposes nothing. The publish job flips
      # the pointers once every node passed.
      - name: Upload data to R2 (${{ inputs.mode }})
        if: inputs.mode != 'test'
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.CLOUDFLARE_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          PFX="${R2_KEY_PREFIX:-}"          # '' or 'rootfs/'
          source "$GITHUB_WORKSPACE/tools/rootfs-builder/r2-cp.sh"   # s3cp: aws s3 cp with retries
          cd dist

          # Big artifacts first, then their per-artifact sidecars (.meta4/.sha256/.installed/
          # .torrent). Pointers, logs and the queue stay for the publish job.
          shopt -s nullglob
          for f in k2go_*.tar.gz; do
            echo ">> upload artifact $f"
            s3cp "$f" "s3://${BUCKET_NAME}/${PFX}${f}"
          done
          s3cp . "s3://${BUCKET_NAME}/${PFX}" --recursive --exclude "*.tar.gz" \
            --exclude "latest_*" --exclude "build-*.log" --exclude "PUBLISH_QUEUE*.tsv"

      - name: Hand pointers and logs to the publish job
        if: inputs.mode != 'test'
        uses: actions/upload-artifact@v4
        with:
          name: pointers-${{ matrix.arch }}-${{ matrix.tier }}
          path: |
            dist/latest_*
            dist/build-*.log
            dist/PUBLISH_QUEUE*.tsv
          if-no-files-found: error
          retention-days: 3

  # K2GO-511: the all-or-nothing gate. Runs only when EVERY bake node succeeded; one failure and no
  # pointer moves, exactly as before. Flips the pointers last, after all data is on R2.
  publish:
    needs: [plan, bake]
    if: inputs.mode != 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Collect pointers and logs from every node
        uses: actions/download-artifact@v4
        with:
          pattern: pointers-*
          path: nodes

      - name: Publish pointers to R2 (${{ inputs.mode }}) + prune
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.CLOUDFLARE_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          MODE="${{ inputs.mode }}"
          KEEP=7          # keep newest 7 batches per (tier,arch); heavy uploads, ~100GB at 7
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          PFX="${R2_KEY_PREFIX:-}"          # '' or 'rootfs/'
          source "$GITHUB_WORKSPACE/tools/rootfs-builder/r2-cp.sh"   # s3cp: aws s3 cp with retries

          # Merge the nodes into one staging dir. Each node of an arch writes its own
          # PUBLISH_QUEUE_<arch>.tsv with only its rows, so concatenate those (one header).
          mkdir -p stage
          shopt -s nullglob
          for d in nodes/*/; do
            for f in "$d"latest_* "$d"build-*.log; do cp "$f" stage/; done
            for q in "$d"PUBLISH_QUEUE*.tsv; do
              qn="stage/$(basename "$q")"
              if [ -f "$qn" ]; then grep -v '^built_utc' "$q" >> "$qn" || true; else cp "$q" "$qn"; fi
            done
          done
          cd stage
          ls -l

          # K2GO-511: dev and publish write DIFFERENT pointer families. publish owns the stable
          # latest_* pointers and the shared catalog inputs (build-*.log, PUBLISH_QUEUE*.tsv) the
          # production catalogs consume. dev writes only dev_latest_* and dev_build-*.log, never
          # those shared inputs, and never prunes, so a staging bake cannot change or delete
          # anything a production install depends on.
          if [ "$MODE" = dev ]; then PP="dev_latest_"; else PP="latest_"; fi
          for f in latest_*.meta4 latest_*.installed; do
            dest="${f/latest_/$PP}"
            echo ">> pointer $dest"
            s3cp "$f" "s3://${BUCKET_NAME}/${PFX}${dest}"
          done
          # dev keeps its logs as dev_build-* so promote-rootfs can carry them to build-*
          # (the module-size catalog reads build-full-arm64-v8a.log).
          for f in build-*.log; do
            if [ "$MODE" = dev ]; then s3cp "$f" "s3://${BUCKET_NAME}/${PFX}dev_${f}"
            else s3cp "$f" "s3://${BUCKET_NAME}/${PFX}${f}"; fi
          done
          if [ "$MODE" = publish ]; then
            for f in PUBLISH_QUEUE*.tsv; do s3cp "$f" "s3://${BUCKET_NAME}/${PFX}${f}"; done
          fi

          # Prune (publish only; dev never deletes): keep the newest $KEEP batches per (tier,arch);
          # delete older + sidecars. Only the heavy dated tarballs accumulate (they carry
          # <date>_<sha>); logs and the TSV overwrite in place, so they never pile up. The prefix
          # filter matches k2go_* only, so proot-distro-v*/ is never touched.
          # FOLLOW-UP (K2GO-511): this prune is not yet pointer-aware, so it could delete a dated
          # tarball a dev_latest_* staging pointer still names. Safe today (dev never reaches this
          # branch, publish is manual); the pointer-protected two-lane prune is a separate step.
          if [ "$MODE" = publish ]; then
            for meta in latest_*.meta4; do
              base="${meta%.meta4}"; te="${base#latest_}"
              ARCH="${te##*_}"; tier="${te%_${ARCH}}"
              mapfile -t keys < <(aws s3api list-objects-v2 --bucket "$BUCKET_NAME" \
                --prefix "${PFX}k2go_" --endpoint-url "$ENDPOINT" \
                --query "sort_by(Contents,&LastModified)[?contains(Key,'_${tier}_') && ends_with(Key,'_${ARCH}.tar.gz')].Key" \
                --output text | tr '\t' '\n' | sed '/^$/d')
              n=${#keys[@]}
              if (( n > KEEP )); then
                for key in "${keys[@]:0:n-KEEP}"; do
                  echo ">> prune $key (+ sidecars)"
                  for ext in '' .meta4 .sha256 .installed .torrent .minisig; do
                    aws s3 rm "s3://${BUCKET_NAME}/${key}${ext}" --endpoint-url "$ENDPOINT" || true
                  done
                done
              fi
            done
          fi

      # K2GO-554 consistency check: every pointer just published must resolve to a tarball that
      # carries a .minisig on R2 (no pointer to an unsigned tarball). Dormant until signing is
      # enabled. The prune above deletes a tarball's .minisig in lockstep with it, so an orphan
      # signature cannot accumulate.
      - name: Verify published signatures (K2GO-554)
        if: vars.ROOTFS_SIGNING_ENABLED == 'true'
        run: |
          set -euo pipefail
          PFX="${R2_KEY_PREFIX:-}"
          TARBALL_RE='k2go_[0-9.]+_[a-z]+_[0-9a-f]+_[a-z0-9-]+\.tar\.gz'
          shopt -s nullglob
          rc=0
          for m in stage/latest_*.meta4; do
            tb="$(grep -oE "$TARBALL_RE" "$m" | head -1 || true)"
            [ -n "$tb" ] || { echo "FATAL: $(basename "$m") names no tarball" >&2; rc=1; continue; }
            if curl -sfI -m 30 "${ROOTFS_PUBLIC_BASE}/${PFX}${tb}.minisig" >/dev/null; then
              echo ">> ok: ${tb}.minisig present"
            else
              echo "FATAL: ${tb}.minisig missing on R2 (pointer $(basename "$m"))" >&2; rc=1
            fi
          done
          exit "$rc"
