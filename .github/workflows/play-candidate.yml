name: Play candidate (send a release candidate to Google review)

# K2GO-564, button 1 of the release flow. Design: controller/docs/ADR-K2GO-564-play-release-candidates.md
# Builds the Play AAB from the selected branch, takes the next versionCode from Play, sends the build
# to Google review on the chosen track and tags the commit with its versionName (vX.Y.Z-rc.N). Google
# gives its verdict by email and in Play Console (the API cannot read it). If Google rejects, fix the
# code, bump versionName to rc.N+1 and run this workflow again.
# Runs only from main. The internal track has no formal review, so an internal run gets no rc tag
# and cannot become a release.
#
# Preconditions: versionName in controller/app/build.gradle is the next candidate (vX.Y.Z-rc.N, the
# tag this run creates) and controller/ci/ota-release-notes.md has a "## vX.Y.Z" entry on top.
# Managed publishing is ON in Play Console, so an approved candidate waits instead of going live.

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track (beta = Open testing)"
        type: choice
        options: [beta, internal]
        default: beta

permissions:
  contents: write   # push the rc tag

# One Play upload at a time: two parallel runs would race for the same versionCode.
concurrency:
  group: play-publish
  cancel-in-progress: false

env:
  PACKAGE: org.appdevforall.k2go

jobs:
  candidate:
    name: Build, send to review and tag the candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The environment holds PLAY_SERVICE_ACCOUNT_JSON and asks a repo admin to approve each run.
    environment: google-play

    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this from main, not $GITHUB_REF: a candidate can become the release."; exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit tests (release rules)
        working-directory: tools/play-publish
        run: python -m unittest -v test_play_publish

      - name: Plan (version, rc tag, release notes, versionCode)
        id: plan
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ inputs.track }}
        run: |
          set -euo pipefail
          git ls-remote --tags origin 'v*' | sed 's#.*refs/tags/##; s#\^{}$##' | sort -u > "$RUNNER_TEMP/tags.txt"
          python tools/play-publish/play_publish.py plan \
            --gradle controller/app/build.gradle \
            --notes controller/ci/ota-release-notes.md \
            --tags "$RUNNER_TEMP/tags.txt" \
            --notes-out "$RUNNER_TEMP/notes.txt" > "$RUNNER_TEMP/plan.env"
          . "$RUNNER_TEMP/plan.env"
          code=$(python tools/play-publish/play_publish.py next-code --package "$PACKAGE" --base "$code_base")
          # Only a reviewed track makes a candidate. An internal build is labeled, never tagged.
          if [ "$TRACK" = "beta" ]; then label="$rc_tag"; else label="$version-internal.$code"; fi
          { cat "$RUNNER_TEMP/plan.env"; echo "code=$code"; echo "label=$label"; } >> "$GITHUB_OUTPUT"
          echo "$label, versionCode $code, commit $GITHUB_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Create google-services.json
        working-directory: controller
        env:
          GOOGLE_SERVICES_JSON_K2GO_ANALYTICS: ${{ secrets.GOOGLE_SERVICES_JSON_K2GO_ANALYTICS }}
        run: echo "$GOOGLE_SERVICES_JSON_K2GO_ANALYTICS" > app/google-services.json

      - name: Decode Keystore
        working-directory: controller
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$ENCODED_STRING" | base64 -d > keystore.jks

      # The upload key signs the AAB; Play App Signing re-signs what users install.
      - name: Build and sign the Play AAB
        working-directory: controller
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_DSN_RELEASE: ${{ secrets.SENTRY_DSN_RELEASE }}
          CODE: ${{ steps.plan.outputs.code }}
        run: |
          chmod +x gradlew
          ./gradlew bundlePlayRelease \
            -PversionSuffix="" \
            -PplayVersionCode="$CODE" \
            -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Send to Google review
        id: send
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ inputs.track }}
          CODE: ${{ steps.plan.outputs.code }}
          LABEL: ${{ steps.plan.outputs.label }}
        run: |
          set -euo pipefail
          aabs=$(find controller/app/build/outputs/bundle/playRelease -name '*.aab')
          if [ "$(printf '%s\n' "$aabs" | grep -c .)" != "1" ]; then
            echo "::error::Expected exactly one Play AAB, found: '$aabs'"; exit 1
          fi
          echo "aab=$aabs" >> "$GITHUB_OUTPUT"
          python tools/play-publish/play_publish.py publish \
            --package "$PACKAGE" --track "$TRACK" --aab "$aabs" --code "$CODE" \
            --name "$LABEL ($CODE)" --notes-file "$RUNNER_TEMP/notes.txt"

      # Tag only after Play accepted the upload, so every rc tag is a build Google is reviewing.
      - name: Tag the candidate commit
        if: inputs.track == 'beta'
        env:
          RC_TAG: ${{ steps.plan.outputs.rc_tag }}
        run: |
          git tag "$RC_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RC_TAG"

      # Keep the exact AAB sent to Play (K2GO-433 archive), named after its label.
      - name: Archive the AAB to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.CLOUDFLARE_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET_NAME: "k2go-apk-repo"
          AAB: ${{ steps.send.outputs.aab }}
          LABEL: ${{ steps.plan.outputs.label }}
        run: |
          aws s3 cp "$AAB" "s3://$BUCKET_NAME/K2Go-$LABEL-play-release.aab" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type "application/octet-stream"

      - name: Summary
        env:
          TRACK: ${{ inputs.track }}
          CODE: ${{ steps.plan.outputs.code }}
          LABEL: ${{ steps.plan.outputs.label }}
        run: |
          {
            echo "## $LABEL sent to the $TRACK track"
            echo "- versionCode $CODE, commit $GITHUB_SHA"
            if [ "$TRACK" = "beta" ]; then
              echo "- Google answers by email and in Play Console (Publishing overview)."
              echo "- Approved: run **Play release** with \`$LABEL\`, then press **Publish changes** in Play Console."
              echo "- Rejected: fix the code, then run this workflow again (next: rc.N+1)."
            else
              echo "- Internal test build: no rc tag, so it cannot become a release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup secrets
        if: always()
        run: rm -f controller/keystore.jks controller/app/google-services.json
