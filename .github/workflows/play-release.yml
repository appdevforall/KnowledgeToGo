name: "Play: 2. publish release"

# K2GO-564, button 2 of the release flow. Design: controller/docs/ADR-K2GO-564-play-release-candidates.md
# Run this from main after Google approved a candidate and main says versionName "vX.Y.Z" (the final
# commit: same code, only the version line changed). It tags that commit with the final version and
# runs the release build: GitHub Release, website APKs, R2 and the OTA update.json. An rc build is
# never released as final (check-release).

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: "Approved candidate tag, for example v1.2.0-rc.3 (the final commit is main)"
        required: true

concurrency:
  group: play-publish
  cancel-in-progress: false

jobs:
  tag:
    name: Tag the approved candidate as the release
    runs-on: ubuntu-latest
    environment: google-play
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.final.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Create the final tag on the candidate commit
        id: final
        env:
          RC_TAG: ${{ inputs.rc_tag }}
        run: |
          set -euo pipefail
          # Refuses a malformed tag, a released version, and a candidate older than the newest.
          git ls-remote --tags origin 'v*' | sed 's#.*refs/tags/##; s#\^{}$##' | sort -u > "$RUNNER_TEMP/tags.txt"
          final=$(python3 tools/play-publish/play_publish.py final-tag --rc-tag "$RC_TAG" --tags "$RUNNER_TEMP/tags.txt")
          # The final commit is main: an rc build is never released as final, so it must say versionName "$final".
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this from main, not $GITHUB_REF."; exit 1
          fi
          python3 tools/play-publish/play_publish.py check-release --gradle controller/app/build.gradle --tag "$final"
          git tag "$final" "$GITHUB_SHA"
          git push origin "refs/tags/$final"
          echo "tag=$final" >> "$GITHUB_OUTPUT"
          {
            echo "## $final tagged on $GITHUB_SHA (approved candidate: $RC_TAG)"
            echo "- Now press **Publish changes** in Play Console to release the approved AAB."
          } >> "$GITHUB_STEP_SUMMARY"

  # A tag pushed with GITHUB_TOKEN does not start other workflows, so call the release build here.
  release:
    name: Release build (GitHub, website, OTA)
    needs: tag
    permissions:
      contents: write
    uses: ./.github/workflows/android-release-build.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
