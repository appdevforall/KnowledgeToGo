name: "Bins: 1. build static (PRoot)"

on:
  workflow_dispatch:
    inputs:
      layout:
        description: "parallel = one runner per ABI (default). serial = both ABIs on one runner (the original layout)."
        type: choice
        options: [parallel, serial]
        default: parallel

jobs:
  # The build and the tests (smoke, kernel matrix) run in bins-build-test.yml, with the pinned
  # sources. The weekly canary (test-bins-canary.yml) runs the same jobs on the newest upstream.
  build:
    uses: ./.github/workflows/bins-build-test.yml
    with:
      layout: ${{ inputs.layout }}
      upstream: pinned

  publish:
    name: Publish rolling release
    needs: build
    # Only main publishes. A run on another branch builds and tests, and stops here.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write          # K2GO-506: sign the build provenance (Sigstore)
      attestations: write
    steps:
    - name: Download built binaries
      uses: actions/download-artifact@v7
      with:
        name: termux-ninja-binaries
        path: ${{ github.workspace }}/termux-artifacts

    - name: Zip binaries for release distribution
      run: |
        cd ${{ github.workspace }}/termux-artifacts
        zip -r ../termux-binaries-latest.zip .

    # K2GO-506: signed build provenance for the zip. Any copy (GitHub, R2, a box) can be checked
    # against this run: gh attestation verify termux-binaries-latest.zip --repo <owner>/<repo>
    # If it fails, the publish stops: no release ships without provenance.
    - name: Attest build provenance
      uses: actions/attest@v4
      with:
        subject-path: ${{ github.workspace }}/termux-binaries-latest.zip

    - name: Generate dynamic tag (date & time)
      run: echo "TAG_NAME=binaries-$(date +'%Y-%m-%d_%H-%M')" >> $GITHUB_ENV

    - name: Publish rolling release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: "Static binaries [${{ env.TAG_NAME }}]"
        body: "Automated rolling build of static PRoot and utilities. Passed the native-binary contract/smoke gate (ADFA-4465)."
        files: ${{ github.workspace }}/termux-binaries-latest.zip
        prerelease: true

  # K2GO-506: archive the new release to R2, then prune old releases. The prune keeps the newest 6
  # and every tag that main or a v* tag pins, and deletes only releases already archived in R2.
  lifecycle:
    needs: publish
    uses: ./.github/workflows/bins-2-archive.yml
    secrets: inherit
    permissions:
      contents: write
