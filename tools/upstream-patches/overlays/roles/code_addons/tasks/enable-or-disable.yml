- name: Enable http://box{{ code_addons_url }} via NGINX, by installing {{ nginx_conf_dir }}/code-addons-nginx.conf
  template:
    src: code-addons-nginx.conf.j2
    dest: "{{ nginx_conf_dir }}/code-addons-nginx.conf"    # /etc/nginx/conf.d
    mode: "0644"
  when: code_addons_enabled

- name: Disable http://box{{ code_addons_url }} via NGINX, by removing {{ nginx_conf_dir }}/code-addons-nginx.conf
  file:
    path: "{{ nginx_conf_dir }}/code-addons-nginx.conf"    # /etc/nginx/conf.d
    state: absent
  when: not code_addons_enabled

- name: Reload 'nginx' systemd service (not proot)
  systemd:
    name: nginx
    state: reloaded
  when: not is_proot

- name: Restart 'nginx' via pdsm (proot)
  command: pdsm restart nginx
  when: is_proot
