- name: Record (initial) disk space used
  shell: df -B1 --output=used / | tail -1
  register: df1


# Mirror the published build assets into the serve directory. mirror_code_assets.py
# reads the committed manifest (files/code_assets_manifest.json), downloads each
# file, verifies it against the sibling ".md5", writes the ".md5" next to it, and
# generates the browse page (index.html). It needs network and pulls the full
# release set (hundreds of MB), so it is SLOW. A non-zero exit (a failed download
# or a checksum mismatch) fails the role.

- name: Create the serve directory {{ code_assets_serve_path }}
  file:
    path: "{{ code_assets_serve_path }}"    # /library/www/code-assets
    state: directory

- name: Mirror the build assets from {{ code_assets_source_base }} (downloads the release set, SLOW)
  command: >
    python3 {{ role_path }}/files/mirror_code_assets.py
    --source-base {{ code_assets_source_base }}
    --serve-base {{ code_assets_url }}
    --out {{ code_assets_serve_path }}


- name: Record (final) disk space used
  shell: df -B1 --output=used / | tail -1
  register: df2

- name: Add 'code_assets_disk_usage = {{ df2.stdout | int - df1.stdout | int }}' to {{ iiab_ini_file }}
  ini_file:
    path: "{{ iiab_ini_file }}"    # /etc/iiab/iiab.ini
    section: code_assets
    option: code_assets_disk_usage
    value: "{{ df2.stdout | int - df1.stdout | int }}"

- name: "Set 'code_assets_installed: True'"
  set_fact:
    code_assets_installed: True

- name: "Add 'code_assets_installed: True' to {{ iiab_state_file }}"
  lineinfile:
    path: "{{ iiab_state_file }}"    # /etc/iiab/iiab_state.yml
    regexp: '^code_assets_installed'
    line: 'code_assets_installed: True'
