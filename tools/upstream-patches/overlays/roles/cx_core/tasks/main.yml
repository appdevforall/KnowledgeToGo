- name: Assert that "cx_core_install is sameas true" (boolean not string etc)
  assert:
    that: cx_core_install is sameas true
    fail_msg: "PLEASE SET 'cx_core_install: True' e.g. IN: /etc/iiab/local_vars.yml"
    quiet: yes

- name: Assert that "cx_core_enabled | type_debug == 'bool'" (boolean not string etc)
  assert:
    that: cx_core_enabled | type_debug == 'bool'
    fail_msg: "PLEASE GIVE VARIABLE 'cx_core_enabled' A PROPER (UNQUOTED) ANSIBLE BOOLEAN VALUE e.g. IN: /etc/iiab/local_vars.yml"
    quiet: yes


- block:

    - name: Install the content-exchange core if 'cx_core_installed' not defined, e.g. in {{ iiab_state_file }}
      include_tasks: install.yml
      when: cx_core_installed is undefined

    - name: Enable/Disable the content-exchange core service
      include_tasks: enable-or-disable.yml

    - name: Add 'cx_core' variable values to {{ iiab_ini_file }}
      ini_file:
        path: "{{ iiab_ini_file }}"    # /etc/iiab/iiab.ini
        section: cx_core
        option: "{{ item.option }}"
        value: "{{ item.value | string }}"
      with_items:
        - option: name
          value: Content exchange core
        - option: description
          value: 'In-box REST service for granular content exchange (Kiwix, Kolibri, Calibre).'
        - option: cx_core_install
          value: "{{ cx_core_install }}"
        - option: cx_core_enabled
          value: "{{ cx_core_enabled }}"
        - option: cx_core_port
          value: "{{ cx_core_port }}"

  rescue:

    - name: 'SEE ERROR ABOVE (skip_role_on_error: {{ skip_role_on_error }})'
      fail:
        msg: ""
      when: not skip_role_on_error
