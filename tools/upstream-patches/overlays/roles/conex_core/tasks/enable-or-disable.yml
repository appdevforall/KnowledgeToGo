# Enable/disable phase (every apply). Reflects conex_core_enabled on the supervisor, then
# verifies the core answers, then reflects conex_core_share_expose on the off-loopback
# Share gate. Verbs are idempotent, so this runs on every play without churn.

# ---- Service state: enable + start, or stop + disable ----

- name: Enable + start conex-core via PDSM (proot, enabled)
  command: "pdsm {{ item }} conex-core"
  with_items:
    - enable
    - start
  when: is_proot and conex_core_enabled

- name: Stop + disable conex-core via PDSM (proot, disabled)
  command: "pdsm {{ item }} conex-core"
  with_items:
    - stop
    - disable
  when: is_proot and not conex_core_enabled

- name: Enable + start conex-core via systemd (not proot, enabled)
  systemd:
    name: conex-core
    enabled: yes
    state: started
  when: not is_proot and conex_core_enabled

- name: Stop + disable conex-core via systemd (not proot, disabled)
  systemd:
    name: conex-core
    enabled: no
    state: stopped
  when: not is_proot and not conex_core_enabled


# ---- Health gate: the REST API answers on loopback. Gates the marker (state.yml runs
# after this): a core that does not answer fails the apply and leaves no marker. ----

- name: Wait for the core to answer GET /v1/apps on 127.0.0.1:{{ conex_core_port }}
  uri:
    url: "http://127.0.0.1:{{ conex_core_port }}/v1/apps"
    status_code: 200
  register: conex_core_health
  until: conex_core_health.status == 200
  retries: 10
  delay: 2
  when: conex_core_enabled


# ---- Off-loopback Share gate (K2GO-376). The role's own nginx conf in conf.d, like any
# role: locations on the box's main server that expose ONLY {{ conex_core_url }}/v1/share/...
# Installed when conex-core is enabled AND share exposure is on; removed otherwise
# (fail-closed). ----

- name: Enable http://box{{ conex_core_url }}/v1/share/ via NGINX, by installing {{ nginx_conf_dir }}/conex-core-nginx.conf
  template:
    src: conex-core-nginx.conf.j2
    dest: "{{ nginx_conf_dir }}/conex-core-nginx.conf"    # /etc/nginx/conf.d
    mode: "0644"
  when: conex_core_enabled and conex_core_share_expose
  register: cx_share_conf

- name: Disable http://box{{ conex_core_url }}/v1/share/ via NGINX, by removing {{ nginx_conf_dir }}/conex-core-nginx.conf
  file:
    path: "{{ nginx_conf_dir }}/conex-core-nginx.conf"    # /etc/nginx/conf.d
    state: absent
  when: not (conex_core_enabled and conex_core_share_expose)
  register: cx_share_removed

# An earlier role version wrote a separate :8095 server block into this dir, which needed an
# include in the global nginx.conf. Remove it on boxes that ran that version.
- name: Remove the retired Share listener dir /etc/nginx/k2go-http.d
  file:
    path: /etc/nginx/k2go-http.d
    state: absent
  register: cx_share_legacy

# Reload nginx ONLY when the Share conf changed in this run, not on every play. Gating on the
# change avoids bouncing nginx (and, on proot, every live portal connection) when nothing
# changed. A graceful systemd reload, or a pdsm restart on proot (pdsm has no reload verb).
- name: Reload 'nginx' systemd service when the Share conf changed (not proot)
  systemd:
    name: nginx
    state: reloaded
  when:
    - not is_proot
    - (cx_share_conf is changed) or (cx_share_removed is changed) or (cx_share_legacy is changed)

- name: Restart 'nginx' via pdsm when the Share conf changed (proot)
  command: pdsm restart nginx
  changed_when: true
  when:
    - is_proot
    - (cx_share_conf is changed) or (cx_share_removed is changed) or (cx_share_legacy is changed)
