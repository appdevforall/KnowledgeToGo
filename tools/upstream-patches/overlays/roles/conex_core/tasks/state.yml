# State phase (after a successful apply). Records the reported settings in iiab.ini and
# writes the install marker LAST. On iiab master the marker is a lineinfile in
# iiab_state.yml; #4546 replaces this with the iiab_state module (see main.yml).

# Read the core build from the installed source (the single source: conex_core/__init__.py
# VERSION), so the box can report which core it runs. Mirrors dash-node's package.json
# version in /system/version (K2GO-507).
- name: Read the installed conex_core source version
  slurp:
    src: "{{ conex_core_serve_path }}/conex_core/__init__.py"
  register: conex_core_init_py

- name: Set conex_core_version from the source
  set_fact:
    conex_core_version: "{{ conex_core_init_py.content | b64decode | regex_search('VERSION\\s*=\\s*\"([^\"]+)\"', '\\1') | first }}"

- name: Add 'conex_core' variable values to {{ iiab_ini_file }}
  ini_file:
    path: "{{ iiab_ini_file }}"    # /etc/iiab/iiab.ini
    section: conex_core
    option: "{{ item.option }}"
    value: "{{ item.value | string }}"
  with_items:
    - option: name
      value: Content exchange core
    - option: description
      value: 'In-box REST service for granular content exchange (Kiwix, Kolibri, Calibre).'
    - option: conex_core_install
      value: "{{ conex_core_install }}"
    - option: conex_core_enabled
      value: "{{ conex_core_enabled }}"
    - option: conex_core_port
      value: "{{ conex_core_port }}"
    - option: version
      value: "{{ conex_core_version }}"

- name: "Set 'conex_core_installed: True'"
  set_fact:
    conex_core_installed: True

- name: "Add 'conex_core_installed: True' to {{ iiab_state_file }}"
  lineinfile:
    path: "{{ iiab_state_file }}"    # /etc/iiab/iiab_state.yml
    regexp: '^conex_core_installed'
    line: 'conex_core_installed: True'
