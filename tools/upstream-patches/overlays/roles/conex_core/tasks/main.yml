- name: Assert that "conex_core_install is sameas true" (boolean not string etc)
  assert:
    that: conex_core_install is sameas true
    fail_msg: "PLEASE SET 'conex_core_install: True' e.g. IN: /etc/iiab/local_vars.yml"
    quiet: yes

- name: Assert that "conex_core_enabled | type_debug == 'bool'" (boolean not string etc)
  assert:
    that: conex_core_enabled | type_debug == 'bool'
    fail_msg: "PLEASE GIVE VARIABLE 'conex_core_enabled' A PROPER (UNQUOTED) ANSIBLE BOOLEAN VALUE e.g. IN: /etc/iiab/local_vars.yml"
    quiet: yes


- block:

    - name: Install the content-exchange core if 'conex_core_installed' not defined, e.g. in {{ iiab_state_file }}
      include_tasks: install.yml
      when: conex_core_installed is undefined

    - name: Enable/Disable the content-exchange core service
      include_tasks: enable-or-disable.yml

    # Read the core build from the installed source (the single source: conex_core/__init__.py
    # VERSION), so the box can report which core it runs. Mirrors dash-node's package.json
    # version in /system/version (K2GO-507).
    - name: Read the installed conex_core source version
      slurp:
        src: "{{ conex_core_serve_path }}/conex_core/__init__.py"
      register: conex_core_init_py

    - name: Set conex_core_version from the source
      set_fact:
        conex_core_version: "{{ conex_core_init_py.content | b64decode | regex_search('VERSION\\s*=\\s*\"([^\"]+)\"', '\\1') | first }}"

    - name: Add 'conex_core' variable values to {{ iiab_ini_file }}
      ini_file:
        path: "{{ iiab_ini_file }}"    # /etc/iiab/iiab.ini
        section: conex_core
        option: "{{ item.option }}"
        value: "{{ item.value | string }}"
      with_items:
        - option: name
          value: Content exchange core
        - option: description
          value: 'In-box REST service for granular content exchange (Kiwix, Kolibri, Calibre).'
        - option: conex_core_install
          value: "{{ conex_core_install }}"
        - option: conex_core_enabled
          value: "{{ conex_core_enabled }}"
        - option: conex_core_port
          value: "{{ conex_core_port }}"
        - option: version
          value: "{{ conex_core_version }}"

  rescue:

    - name: 'SEE ERROR ABOVE (skip_role_on_error: {{ skip_role_on_error }})'
      fail:
        msg: ""
      when: not skip_role_on_error
