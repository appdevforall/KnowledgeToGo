# conex_core lifecycle. This MIRRORS the iiab#4546 shared runner
# (roles/0-init/tasks/lifecycle.yml) but dispatches the phases itself, because that
# runner (and its iiab_state module / installed lookup) is not on iiab master, which we
# bake today. When #4546 lands upstream this main.yml collapses to a one-line
# "include_role: 0-init, tasks_from: lifecycle", and the phase files below are already in
# the standard shape. Phases: install (first install / --reinstall), configure (every
# apply), enable-or-disable (every apply), state (after a successful apply), uninstall
# (--uninstall). See the awstats template and the README "Role task lifecycle".

# Uninstall is OUTSIDE the block/rescue on purpose: an explicit uninstall must fail loud,
# not be swallowed by skip_role_on_error in a larger play. 'uninstall' is undefined on
# master, so default it false.
- name: Uninstall conex_core
  include_tasks: uninstall.yml
  when: uninstall | default(false) | bool

- name: Apply conex_core
  when: not (uninstall | default(false) | bool)
  block:

    - name: Assert that "conex_core_install is sameas true" (boolean not string etc)
      assert:
        that: conex_core_install is sameas true
        fail_msg: "PLEASE SET 'conex_core_install: True' e.g. IN: /etc/iiab/local_vars.yml"
        quiet: yes

    - name: Assert that "conex_core_enabled | type_debug == 'bool'" (boolean not string etc)
      assert:
        that: conex_core_enabled | type_debug == 'bool'
        fail_msg: "PLEASE GIVE VARIABLE 'conex_core_enabled' A PROPER (UNQUOTED) ANSIBLE BOOLEAN VALUE e.g. IN: /etc/iiab/local_vars.yml"
        quiet: yes

    # install.yml may copy source and register the supervisor, so it runs only on first
    # install (marker undefined) or --reinstall. A plain apply skips it: settings that must
    # be reconciled every time live in configure.yml / enable-or-disable.yml instead.
    - name: Install or repair conex_core
      include_tasks: install.yml
      when: conex_core_installed is undefined or (reinstall | default(false) | bool)

    - name: Configure conex_core
      include_tasks: configure.yml

    - name: Enable or disable conex_core
      include_tasks: enable-or-disable.yml

    # Marker is written LAST, only after a successful apply (install + configure + a
    # healthy enable). A failure above lands in rescue and leaves no marker, so the next
    # run re-runs install.
    - name: Record conex_core state
      include_tasks: state.yml

  rescue:

    - name: 'SEE ERROR ABOVE (skip_role_on_error: {{ skip_role_on_error }})'
      fail:
        msg: ""
      when: not skip_role_on_error
