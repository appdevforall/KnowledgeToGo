# Install/update phase (first install and --reinstall only). The core is pure Python 3
# stdlib (no pip install), so "install" is a file copy plus registering the supervisor.
# The supervisor is PDSM under proot and systemd otherwise, chosen by is_proot. Starting,
# enabling and the health check live in enable-or-disable.yml (every apply); the install
# marker lives in state.yml (written last, on success).

- name: Create the install dir {{ conex_core_serve_path }}
  file:
    path: "{{ conex_core_serve_path }}"    # /opt/conex-core
    state: directory
    mode: "0755"

- name: Copy the core source into {{ conex_core_serve_path }}
  copy:
    src: "{{ conex_core_src_dir }}/"       # trailing slash: copy the contents
    dest: "{{ conex_core_serve_path }}/"
    remote_src: yes
    mode: preserve

- name: Create the export staging dir (on the content volume, not /tmp)
  file:
    path: "{{ content_base }}/.conex-staging"    # /library/.conex-staging (core CONEX_STAGING_DIR default)
    state: directory
    mode: "0755"


# ---- Launch wrapper: PDSM under proot ----
# proot_services owns the service-available wrappers; here we only drop ours. Enabling and
# starting happen in enable-or-disable.yml.

- name: Install the PDSM service wrapper (proot)
  copy:
    src: "{{ conex_core_pdsm_src }}"       # static/pdsm/conex-core
    dest: /usr/local/pdsm/services-available/conex-core
    remote_src: yes
    mode: "0755"
  when: is_proot


# ---- Launch wrapper: systemd otherwise (IIAB) ----

- name: Install the systemd unit (not proot)
  template:
    src: conex-core.service.j2
    dest: /etc/systemd/system/conex-core.service
    mode: "0644"
  when: not is_proot

- name: Reload systemd so the new unit is visible (not proot)
  systemd:
    daemon_reload: yes
  when: not is_proot
