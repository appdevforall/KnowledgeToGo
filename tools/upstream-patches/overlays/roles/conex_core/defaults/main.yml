# conex_core_install: True
# conex_core_enabled: True

# The content-exchange core: an in-box REST service (Python stdlib, no third-party
# deps) that lists, exports and imports content per item across Kiwix, Kolibri and
# Calibre. It is client-agnostic: dash-node (K2Go) or the IIAB Console reach it over
# its localhost REST API. Design: controller/docs/ADR-content-exchange.md (K2GO-427).
#
# The core code is identical on every environment; only the supervisor differs. Under
# proot (K2Go) it runs as a PDSM service; on a systemd host (IIAB) it runs as a systemd
# unit. This role installs the source and the right wrapper, chosen by is_proot.

# Where the source tree is copied FROM. Default is the K2Go repo path on the box
# (/opt/iiab-android). An IIAB deploy overrides this to wherever it stages the source.
conex_core_src_dir: /opt/iiab-android/static/conex-core

# Where the core is installed TO (app code, a fixed path). `python3 -m conex_core` runs
# from here. The CONEX_* runtime paths (zims, kolibri db, staging) default to the box
# layout inside the core itself, so this role sets none of them.
conex_core_serve_path: /opt/conex-core

# The localhost port the core binds. Matches the core's own default and the health
# probe in the service wrappers.
conex_core_port: 9500

# The PDSM service wrapper to install under proot. Ships in the repo next to the
# dash-node wrapper; both drivers (this role and the iiab-android bootstrap) copy it.
conex_core_pdsm_src: "{{ conex_core_src_dir }}/../pdsm/conex-core"


# ---- Operator overrides for the systemd path (IIAB), not proot (K2GO-512) ----
# On proot the core reads the K2Go rootfs defaults directly and dash-node owns the
# Calibre-Web login in credentials.json (dash-node verifies it against live
# Calibre-Web before saving). A systemd box has no dash-node, so the role writes an
# EnvironmentFile instead. Empty values here mean "use the core's own box default",
# so a stock box needs no override.

# Where the role writes those overrides (0600). /etc/iiab exists on an IIAB box.
conex_core_env_file: /etc/iiab/conex-core.env

# Calibre-Web login the core uses to add and remove books. Leave EMPTY to use the
# box default: IIAB seeds calibre-web app.db with Admin / changeme, which the core
# already falls back to. Set BOTH in /etc/iiab/local_vars.yml ONLY when the box
# Calibre-Web password was changed from that default; re-run the role to apply.
conex_core_calibre_user: ""
conex_core_calibre_pass: ""


# ---- Off-loopback Share exposure (K2GO-376, Pillar Share) ----
# Granular wireless Share lets a paired peer on the hotspot PULL selected content from
# this box's live conex-core /v1/share gate. conex-core stays bound to loopback: a dedicated
# nginx listener is the ONLY off-box surface, and it proxies ONLY /v1/share/<session>/
# ... (never the rest of the /v1 API). The share token (X-Share-Token header) is the
# auth; this scope is defense in depth. Design + the rootfs contract:
# controller/docs/conex-core-share-exposure.md.

# The TCP port the Share listener binds on 0.0.0.0. 8095 is free on an IIAB box: the
# 80xx cluster uses 8080/8083/8089 (calibre / calibre-web / sugarizer), 8085 is the
# K2Go portal, and AzuraCast sits at 10000+. Site-configurable, per IIAB tradition;
# the receiver's QR carries <senderHotspotIp>:<this port>.
conex_core_share_port: 8095

# Master switch for the off-box Share surface. False removes the listener and keeps
# conex-core loopback-only (in-box content exchange still works; only wireless Share is
# off). A kill-switch for the one security-sensitive surface, independent of
# conex_core_enabled.
#
# v1 decision (K2GO-376): ON by default on EVERY platform (proot phones AND systemd
# boxes: rpi / pc, arm64 / amd64), so the surface can be observed in the field. The
# listener is inert without an active share session (unknown-session 404, create
# blocked), and every reachable endpoint is token-gated, so an always-bound port leaks
# no content. If observation shows a systemd box should not open it by default, gate the
# install by platform or arch later (an is_proot / arch condition on the install tasks),
# not by removing the switch.
conex_core_share_expose: True


# ---- Data ownership (iiab#4546 lifecycle contract; see README "Data ownership") ----
# Declares what each uninstall / reinstall class owns. Program data is role-managed:
# rebuilt on reinstall, removed on uninstall. User data is content the user created and
# is NEVER deleted here. conex-core owns NO user data: the exchanged content lives in
# Kiwix / Kolibri / Calibre, which own it. These lists document ownership; uninstall.yml
# acts on explicit, platform-split paths (the PDSM wrapper is NOT here: proot_services
# owns it upstream and removing it under proot is destructive, so uninstall only disables
# it; the systemd unit IS role-owned and is removed on the systemd path).
conex_core_program_data:
  - "{{ conex_core_serve_path }}"                     # /opt/conex-core (copied source)
  - "{{ content_base }}/.conex-staging"              # export scratch
  - "{{ conex_core_env_file }}"                       # operator env file (systemd path only)
  - /etc/systemd/system/conex-core.service           # supervisor unit (systemd path only)
  - /etc/nginx/k2go-http.d/conex-core-share.conf     # Share listener (K2GO-376)
conex_core_user_settings: []                          # none seeded force:false
conex_core_user_data: []                              # exchanged content is owned by Kiwix/Kolibri/Calibre
